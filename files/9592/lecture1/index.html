## Example: London Mayoral Election

.pull-left[
London is having a mayoral election.  Incumbent (and former Western LG Program Administrator) is running.

- A poll shows: 

|        | Voters |
|--------|-------|
| Other  | 48    |
| Morgan | 52    |
| Total  | 100   |



Assess `\(H_A:\)` Morgan wins more than `\(50\%\)` of the vote. 

]
.pull-right[
&lt;img src="images/mayor_signs.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

---

## How to Figure This Out?

- **What are we trying to find?** The population parameter `\(\pi^M\)` — the probability a voter picks Morgan.

- **What do we need to learn about it?** A point estimate, and some sense of how much that estimate could vary from sample to sample. 

- **Where does the estimate come from?** The natural best guess for `\(\pi^M\)`: 

`$$\begin{aligned}
\text{Proportion for Morgan} &amp;= \frac{\text{Number for Morgan}}{\text{Total Respondents}}\\\\
p^M &amp;= \frac{N^M}{N^T}
\end{aligned}$$`

---

## Uncertainty

- **Where does the uncertainty/sampling distribution come from?** Rather than deriving it directly, we get it for free once we've modeled the dependent variable itself.
    - Think of each individual vote `\(y_i\)` (Morgan/Other) as the dependent variable. What do we know about it?
        - It only takes two values `\(\to\)` binary/Bernoulli.
        - Each voter has the same underlying probability `\(\pi^M\)` — we have no information to say otherwise.
        - Secret ballot `\(\to\)` one vote doesn't affect another `\(\to\)` independence.
    - Those three properties mean `\(y_i \sim \text{Bernoulli}(\pi^M)\)`.
    - The total count `\(N^M = \sum y_i\)` is a sum of iid Bernoulli trials, so `\(N^M \sim \text{Binomial}(N^T, \pi^M)\)`.
    - Since `\(p^M\)` is just `\(N^M/N^T\)`, this binomial distribution is (up to rescaling) the sampling distribution of our estimate.


---

## Binomial Distribution

.pull-left[
`$$N^M \sim \text{Binomial}(N^T, \pi^M)$$`

The `\(p-\)`value we could calculate using the Binomial PMF: 

`$$f(y) = {n \choose y} p^y(1-p)^{(n-y)}$$`

where `\(n \choose y\)` is the binomial coefficient and is defined as `\(\frac{n!}{y!(n-y)!}\)`.  Calculating this out tells us the number of possible outcomes of size `\(n\)` that have exactly `\(y\)` successes.
]
.pull-right[
`$$\begin{aligned}
\Pr&amp;(N^M \geq 52) = \\\\
&amp;\sum_{k=52}^{100}{100 \choose k}.5^k(1-.5)^{(100-k)}
\end{aligned}$$`

.large-code[

``` r
pbinom(51, 100, .5, lower.tail=FALSE)
```

```
## [1] 0.3821767
```
]
]

## Maximum Likelihood Estimation (MLE)

Maximum Likelihood Estimation is a different way of estimating statistical relationships.  

- Here, we try to identify which parameter values make it most likely (i.e., _maximize the likelihood_) that we would observe the data that we observe. 

---

## Probability

Before we go into MLE, we need to refresh ourselves on the axioms of probability.  Let's assume that the sample space is `\(S\)` (the set of all possible outcomes): 
1. For any event `\(A\)`, `\(Pr(A) \geq 0\)`.
1. `\(Pr(S) = 1\)`
1. If events `\(A\)`, `\(B\)` and `\(C\)` are mutually exclusive, then `\(Pr(A \cup B \cup C) = Pr(A) + Pr(B) + Pr(C)\)`

Each statistical distribution has associated probability functions - most useful for right now - the PDF/PMF and the CDF. 

---

## Probability Density Function

One of the main elements of a likelihood estimation is a _probability density function_ or _PDF_ .  

- The PDF gives the _relative likelihood_ that an observation drawn randomly from a continuous random variable would take on a particular value.
- We can use these relative likelihoods to find the best parameters for our relationships. 
- For discrete variables (like our binomial example), the distribution is a _probability mass function_ or _PMF_. 

---


## Cumulative Distribution Function

A counterpart to the PDF is the _Cumulative Distribution Function_ or _CDF_. 

- The CDF tells us the probability of being below (or alternatively above) a certain value of a random variable. 
- The `\(z\)`- and `\(t\)`- tables in the back of intro stats books give you the CDF for the normal and `\(t\)` distributions evaluated at lots of different points.

## What is Likelihood
The Likelihood Axiom is as follows:

`$$L(\tilde\theta|y) \propto f(y|\tilde\theta)$$`


- `\(f(y|\tilde\theta)\)` is a probability density function of `\(y\)` given the hypothetical model parameters `\(\tilde\theta\)`
- `\(\propto\)` here means we could multiply `\(f(y|\tilde\theta)\)` by *any* positive function of the data alone and get the same answer for which `\(\tilde\theta\)` maximizes it. The absolute value of `\(L\)` is never meaningful, only how it moves as `\(\tilde\theta\)` changes.
- What Maximum Likelihood Estimation does is to pick the parameters `\(\hat{\theta}\)` that make the data most likely to have been generated given the assumptions we make.

---

## Evaluating the Likelihood function
Assuming that you've got lots of `\(y\)` values (i.e., `\(y_{i}\)` for `\(i = {1, \ldots, n}\)`), then you would want to know the aggregate likelihood for all values (i.e., a single number). 

`$$L(\theta | y) = \prod_{i=1}^{n} L(\theta, y_{i}) \propto \prod_{i=1}^{n} f(y_{i} | \theta)$$`

While this would theoretically work fine, taking the product of a bunch of small numbers is going to generate something that the computer will have difficulty dealing with, thus we usually try to maximize the log-likelihood (\ell). 

`$$\ell(\theta | y) = \sum_{i=1}^{n} \ell(\theta, y_{i}) \propto \sum_{i=1}^{n} \log\left(f(y_{i} | \theta)\right)$$`

---

## Score Function

The score function `\(S(\theta)\)` is the first partial derivative of the log-likelihood with respect to the parameter
- First derivative shows us how steep the log-likelihood is at any particular point.  
- Setting the first derivative to zero gives us the point at which the likelihood is maximized. 

For the binomial model: 

`$$\ell(p) = k \log(p) + (n-k)\log(1-p)$$`
`$$S(p) = \frac{\partial \ell}{\partial p} = \frac{k}{p} - \frac{n-k}{1-p}$$`


---

## Likelihood and Score Functions

## Math

**First term** — `\(\dfrac{d}{dp}\big[52\log p\big]\)`: `\(\frac{d}{dp}\big[52\log p\big] = 52\cdot\frac{1}{p} = \frac{52}{p}\)`

**Second term** — `\(\dfrac{d}{dp}\big[48\log(1-p)\big]\)`: here the thing inside the log isn't `\(p\)` itself but `\(u = 1-p\)`, so you need the chain rule: `\(\frac{d}{dp}\log(u) = \frac{1}{u}\cdot\frac{du}{dp}\)`. Since `\(\frac{du}{dp} = \frac{d}{dp}(1-p) = -1\)`,

`$$\frac{d}{dp}\big[48\log(1-p)\big] = 48\cdot\frac{1}{1-p}\cdot(-1) = -\frac{48}{1-p}$$`

**Add them** (sum rule):

`$$S(p) = \frac{52}{p} - \frac{48}{1-p}$$`

---

## Solve

.small-math[
`$$\begin{aligned}
\frac{k}{p} - \frac{n-k}{1-p} = 0\\\\
\frac{k}{p} = \frac{n-k}{1-p} \\\\
k(1-p) = (n-k)p \\\\
k - pk = pn - pk\\\\
k = pn\\\\
\frac{k}{n} = p
\end{aligned}$$`
]

---

## Sampling Uncertainty

Fisher Information is what tells us about the variability of the parameter estimate in repeated sampling. 
- Negative expected first derivative of the score function with respect to `\(p\)` (negative expected second derivative of the log-likelihood function). 
- A more peaked log-likelihood function has lower sampling variability. 


---

## Calculating Fisher Information I

`$$S(p) = \frac{k}{p} - \frac{n-k}{1-p}$$`

Fisher information is `\(I(p) = -E\left[\dfrac{d^2\ell}{dp^2}\right]\)`, so first differentiate the score again:

`$$\frac{d^2\ell}{dp^2} = \frac{d}{dp}\left[\frac{k}{p} - \frac{n-k}{1-p}\right] = -\frac{k}{p^2} - \frac{n-k}{(1-p)^2}$$`

Negate and take the expectation, using `\(E[k] = np\)` since `\(k\sim\text{Binomial}(n,p)\)`:

`$$I(p) = E\left[\frac{k}{p^2} + \frac{n-k}{(1-p)^2}\right] = \frac{np}{p^2} + \frac{n-np}{(1-p)^2} = \frac{n}{p} + \frac{n(1-p)}{(1-p)^2} = \frac{n}{p} + \frac{n}{1-p}$$`

---

## Calculating Fisher Information II

Combine over a common denominator:

`$$I(p) = n\left[\frac{1}{p} + \frac{1}{1-p}\right] = n\cdot\frac{(1-p)+p}{p(1-p)} = \frac{n}{p(1-p)}$$`

The inverse of Fisher Information `\((I(p)^{-1})\)` is the sampling variance of p

`$$\text{Sampling Var}(p) = \frac{p(1-p)}{n}$$`
---

## MLE in R

library(maxLik)
llfun &lt;- function(par, x, n=100){

## Testing the Two Models: Likelihood Ratio Test

.pull-left[
If two models are nested, then we can use a likelihood ratio test to figure out whether the bigger one is "better".  

`$$s = -2\left(\ell(M_{\text{small}}) - \ell(M_{\text{big}})\right)$$`

Under `\(H_{0}:\)` Both Models Same, `\(s \sim \chi_{k_{\text{big}} - k_{\text{small}}}^{2}\)`. 

]
.pull-right[

``` r
llfun1 &lt;- function(par, x, n){
   l &lt;- dbinom(x, n, c(par[1],par[1]), log=TRUE)
   sum(l)
}
out1 &lt;- maxLik(llfun1, x=c(20,32), start=c(both = .5), n = c(30,70))
lmtest::lrtest(out1, out2)
```

```
## Likelihood ratio test
## 
## Model 1: out1
## Model 2: out2
##   #Df  LogLik Df  Chisq Pr(&gt;Chisq)  
## 1   1 -6.1036                       
## 2   2 -4.2272  1 3.7529    0.05272 .
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```

]

## Properties of MLEs

- Consistent - As sample size increases the probability that the MLE differs from the true parameter by an arbitrarily small amount is zero
- Asymptotically efficient which means that the MLE's variance is the smallest among all possible consistent estimators. 
- Asymptotically normally distributed

All of these are asymptotic properties, so they describe the properties of the estimators as `\(n\)` is close to `\(\infty\)`.  They may behave differently in small samples.  We will discuss this a bit later on.

---
