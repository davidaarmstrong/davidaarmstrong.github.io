## Goals for This Session

1. Discuss Interaction Effects in the Linear Model
2. Discuss Interaction Effects in the GLM
3. Presentation of Interaction Results


---

# Interaction Effects 

When the partial effect of one variable depends on the value of another variable, those two variables are said to "interact".  Alternatively, we say that the relationship is _conditional_. 
  - For example, we may want to test whether age effects are different for men (coded 1) and women (coded 0).
  - In such cases we could fit separate regressions for men and women, but this does not allow for a formal statistical test of the differences and only really works as intended in the linear model. 
  - Specification of interaction effects facilitates statistical tests for a difference in slopes within a single regression

---

# Unconditional Effects in the LM

Consider the following linear model: 

`$$y_i = b_0 + b_1 x_i + b_2 z_i + e_i$$`

In this model, the effect of `\(x\)` is: 

`$$\frac{\partial y}{\partial x} = b_1$$` 

The marginal effect is constant.

---

## Mediation vs Moderation


.pull-left[
Moderation asks - does the direct effect of `\(X\)` vary by some other variable, `\(W\)`? 
- This is the effect heterogeneity of interest today. 

Mediation asks - is the effect of `\(X\)` direct and/or indirect through some other variable, `\(M\)`? 
- This is a related, but quite different question that we will not discuss today. 
]
.right-shift50[


&lt;img src="med_mod.png" alt="Two path diagrams stacked vertically. Top diagram labelled Mediation: X points to M (path a) and M points to Y (path b), with a dashed arrow from X directly to Y (path c-prime, the direct effect). Bottom diagram labelled Moderation: X points to Y with a solid arrow, and W points upward to the midpoint of the X-to-Y arrow, indicated by a filled square, showing that W moderates the effect of X on Y rather than transmitting it." width="90%" style="display: block; margin: auto;" /&gt;

## Moderation Effect

Suppose we are estimating a relationship between `\(y\)` and `\(x\)` and we suspect/hypothesize that relationship is moderated by `\(z\)`.  

.pull-left[
- We are really saying: 

`$$\frac{\partial y}{\partial x} = f(z)$$` 

The simplest `\(f(z)\)` would just be linear: 

`$$\frac{\partial y}{\partial x} = b_1 + b_2 z_i$$`
]
.pull-right[
What model would generate this marginal effect: 

`$$y_i = b_0 + b_1x_i + b_2x_iz_i + b_3 z_i + \mathbf{gw}_i + e_i$$`

The marginal effect of `\(x\)` from the above equation is `\(b_1 + b_2 z_i\)`. 
]

???

The interaction term determines how the effect of x changes across values of z. The main effect of z determines how the baseline level of y changes across values of z.

---

## Typology of Moderation Models

We can fit different kinds of moderation models depending on our hypotheses: 

_Typology of Models_



|Model              |Assumption Change                                   |
|:------------------|:---------------------------------------------------|
|Single interaction |Single effect varies across groups                  |
|Full interaction   |All effects vary across groups                      |
|Subgroup Analyses  |All effects + residual variances vary across groups |

---

## Interaction Effects 

We often denote product regressors `\(x_iz_i\)` as _interaction effects_.  

Ultimately we want to know three things:

- Is there statistical evidence of a moderated effect?
- How variable is the moderated effect? 
- Does the variation change or qualify the substantive conclusion? 

Below, we walk through all the possible two-way interaction scenarios and we will discuss how to answer these questions.

## One Categorical + One Numeric

With one categorical variable, `\(d\)` (we'll use a binary variable here) and one numeric variable, `\(x\)`, we would have
 
`$$y_i = b_0 + b_1x_i + b_2 d_i + b_3x_id_i + e_i$$`

We can think of the moderation effect in two ways: 

.pull-left[

_Marginal Effect of `\(x\)`_
`$$\frac{\partial y}{\partial x} = b_1 + b_3 d$$`
]
.pull-right[

_Marginal effect of `\(d\)`_

`$$\frac{\partial y}{\partial d} = b_2 + b_3 x$$`

]

## Two Numeric Variables

With two numeric variables the interpretation gets a bit trickier.  For example, consider the following model:

`$$\hat{Y}_{i} = b_{0} + b_{1}X_{i1} + b_{2}X_{i2} + b_{3}X_{i3} + b_{4}X_{i1}X_{i2}$$`


We want to know the partial conditional effect of both `\(X_1\)` and `\(X_2\)`, but unlike above, neither can be boiled down to a small set of values.  Just think about the equation:

`$$\begin{aligned}
\frac{\partial \hat{Y}}{\partial X_{1}} &amp;= \beta_{1} + \beta_{4}X_{2}\\
\frac{\partial \hat{Y}}{\partial X_{2}} &amp;= \beta_{2} + \beta_{4}X_{1}
\end{aligned}$$`


Note, that `\(\beta_4\)` is the amount by which the *effect* of `\(X_1\)` goes up for every additional unit of `\(X_2\)` and the amount by which the *effect* of `\(X_2\)` goes up for every additional unit of `\(X_1\)`.

---

## Testable Hypotheses

`$$\hat{Y}_{i} = b_{0} + b_{1}X_{i1} + b_{2}X_{i2} + b_{3}X_{i3} + b_{4}X_{i1}X_{i2}$$`
Berry, Golder and Milton (2012) suggest that we should be able to test 5 hypotheses:

.small[
- `\(\mathbf{P}_{X_{1}|X_{2}=\text{min}}\)` The marginal effect of `\(X_{1}\)` is [positive, zero, negative] when `\(X_{2}\)` takes its lowest value.
- `\(\mathbf{P}_{X_{1}|X_{2} = \text{max}}\)` The marginal effect of `\(X_{1}\)` is [positive, zero, negative] when `\(X_{2}\)` takes its highest value.
- `\(\mathbf{P}_{X_{2}|X_{1}=\text{min}}\)` The marginal effect of `\(X_{2}\)` is [positive, zero, negative] when `\(X_{1}\)` takes its lowest value.
- `\(\mathbf{P}_{X_{2}|X_{1} = \text{max}}\)` The marginal effect of `\(X_{2}\)` is [positive, zero, negative] when `\(X_{1}\)` takes its highest value.
- `\(\mathbf{P}_{X_{1}X_{2}}\)` The marginal effect of each of `\(X_{1}\)` and `\(X_{2}\)` is [positively, negatively] related to the other variable.
]


---

## Example


``` r
data(Prestige, package="carData")
Prestige$income &lt;- Prestige$income/1000
addmod &lt;- lm(prestige ~ income + education + type, data=Prestige)
intmod &lt;- lm(prestige ~ income*education + type, data=Prestige)
tidy(intmod)
```

```
## # A tibble: 6 × 5

## Evidence of Moderation

- The `income:education` line answers this question.  If it is significant, then there is a significant interaction, otherwise there is not.

- This is counter to a minor, though still influential, point in Brambor, Clark and Golder (2006), but is consistent with Berry, Golder and Milton (2012).

- The interaction provides evidence of moderation.

## Interpretation


- The effect of income is nearly always significant, though it gets smaller as education gets bigger.  That is, as education increases, we expect smaller increases in prestige from increasing income

- The effect of education is significant and positive until around 16,000 dollars, which is around 2/3 the range of `income`, but is the `\(96^{th}\)` percentile because of the skewness of income.

- This suggests that people tend to derive prestige from either higher incomes or higher education, but not really both.

## When Confidence Bounds Equal Zero

You may want to know when the confidence bounds are equal to zero.  Consider the equation:

`$$\hat{Y}_{i} = \beta_{0} + \beta_{1}X_{i1} + \beta_{2}X_{i2} + \beta_{3}X_{i3} + \beta_{4}X_{i1}X_{i2}$$`


- We know that the conditional effect of `\(X_1\)` is `\(\beta_1 + \beta_4X_2\)` and that the lower bound is `\((\beta_1 + \beta_4X_2) - 1.96\times SE(\beta_1 + \beta_4X_2)\)`.

- Since those are all quantities that we know (or estimate), we could set it equal to zero and solve.

- This is what the `changeSig` function does.

---

## Change in Significance



``` r
changeSig(intmod, c("income", "education"))
```

```

## Transition from Linear to GLM

Consider a linear model: `\(y = b_0 + b_1x + b_2z + e\)`
- The effect of `\(x\)` is `\(\frac{\partial y}{\partial x} = b_1\)`

In the non-linear model: `\(E(y|x,z) = g^{-1}(b_0 + b_1x + b_2z) =  g^{-1}(\eta)\)`
- The effect of `\(x\)` is 

`$$\frac{\partial g^{-1}(\eta)}{\partial x} = \frac{\partial g^{-1}(\eta)}{\partial \eta}\frac{\partial \eta}{\partial x}$$`

---

## Common Links and First Derivatives

| Model | Response Function | Effect of `\(x\)` |
|---------|---------|---------|
| Linear | `\(E(Y)=\eta\)` | `\(\beta_x\)` |
| Binary | `\(p=F(\eta)\)` | `\(\beta_x f(\eta)\)` |
&lt;!-- | Log-Link | `\(\mu=e^\eta\)` | `\(\beta_x \mu\)` | --&gt;
&lt;!-- | Ordered | `\(P(Y=k)=F(\tau_k-\eta)-F(\tau_{k-1}-\eta)\)` | `\(\beta_x[f(\tau_{k-1}-\eta)-f(\tau_k-\eta)]\)` | --&gt;
&lt;!-- | Multinomial Logit | `\(p_k=\frac{e^{\eta_k}}{\sum_j e^{\eta_j}}\)` | `\(p_k\left(\beta_{xk}-\sum_j p_j\beta_{xj}\right)\)` | --&gt;

where

- `\(F(\cdot)\)` is a cumulative distribution function (CDF)
- `\(f(\cdot)=F^{\prime}(\cdot)\)` is the corresponding probability density function (PDF)

---

## Binary Model Example

Consider the binary regression model: 

`$$\log\left(\frac{p}{1-p}\right) = b_0 + b_1x + b_2z$$`

The effect of `\(x\)` is: 

$$\frac{\partial E(y|x,z)}{\partial x} = f(\eta)b_1 = p(1-p)b_1 $$


Because `\(p\)` depends on all predictors, the effect of `\(x\)` changes across values of `\(x\)` and `\(z\)`.

## Link vs Product Term Conditionality

Mechanical conditionality that comes from the non-linear link: 
- _can_ dampen or amplify the coefficient of `\(x\)` as a function of `\(z\)`.
- _cannot_ allow a marginal effect to change signs, but the second difference still could. 

Including a product term: 
- _can_ permit sign flips based on different values of the conditioning variable. 
- _can_ reduce the level of conditionality between `\(x\)` and `\(z\)` in some circumstances. 

---

## Link vs Product Term Conditionality

If `\(E(y|x,z) = g^{-1}(b_0 + b_1x + b_2z)\)`

`$$\frac{\partial g^{-1}(\eta)}{\partial x} = \frac{\partial g^{-1}(\eta)}{\partial \eta}b_1 = f(\eta)b_1$$`

If `\(E(y|x,z) = g^{-1}(b_0 + b_1x + b_2z + b_3xz)\)`

`$$\frac{\partial g^{-1}(\eta)}{\partial x} = \frac{\partial g^{-1}(\eta)}{\partial \eta}(b_1 + b_3z) = f(\eta)(b_1 + b_3z)$$`

Since `\(f(\eta)\)` is a density, it is non-negative

---

## Conditionality in GLMs

If the model induces conditionality by definition, how do we think about moderation? 

1. Just as before - generally, an investigation about conditionality should be theoretically interesting. 
    - At this stage, you should not go "hunting for" interactions.  
2. Unlike before, the mechanical model building exercise does not lead to clear, immediate answers. 
    - Whether the product term is significant and the extent of the moderation are less related here. 
3. Whether a product term belongs in the model depends on whether it generates substantively important conditionality beyond the mechanical conditionality induced by the link function.
    
---

## Evaluating Conditionality


| Variable Types | Marginal Effect of `\(x\)` | Interaction Quantity |
|---------------|-------------------------|----------------------|
| `\(x,z\)` both continuous | `\(\frac{\partial E(Y)}{\partial x}\)` | `\(\frac{\partial}{\partial z}\frac{\partial E(Y)}{\partial x}\)` |
| `\(x\)` continuous, `\(z\)` binary | `\(\frac{\partial E(Y)}{\partial x}\)` | `\(\Delta_z\left(\frac{\partial E(Y)}{\partial x}\right)\)` |
| `\(x,z\)` both binary | `\(\Delta_x E(Y)\)` | `\(\Delta_z\left(\Delta_x E(Y)\right)\)` |

Second differences work for any variable types. They are required whenever a variable is categorical, and for continuous variables the step sizes you choose define the quantity.

---

## The Cross-Partial in the Logit Model

For the logit, `\(\frac{\partial p}{\partial \eta} = p(1-p)\)` and `\(\frac{\partial^2 p}{\partial \eta^2} = p(1-p)(1-2p)\)`.

.pull-left[
_Additive_: `\(\eta = b_0 + b_1x + b_2z\)`

`$$\frac{\partial^2 p}{\partial x \partial z} = b_1b_2\,p(1-p)(1-2p)$$`

- Non-zero whenever `\(b_1\)` and `\(b_2\)` are, except at `\(p = 0.5\)`.
- Changes sign at `\(p = 0.5\)`.
- The marginal effect of `\(x\)` cannot change sign, but the interaction can.
]
.pull-right[
_Product_: `\(\eta = b_0 + b_1x + b_2z + b_3xz\)`

`$$\begin{aligned}
&amp;\frac{\partial^2 p}{\partial x \partial z} = \; b_3\,p(1-p)\; + \\
&amp;\quad\quad(b_1 + b_3z)(b_2 + b_3x)\,p(1-p)(1-2p)
\end{aligned}$$`

- The second term is compression; it remains even if `\(b_3 = 0\)`.
- `\(b_3\)` alone does not give the size, or even the sign, of the interaction (Ai and Norton 2003).
]

???

In the pid-black example, b_pid &lt; 0 and b_black &gt; 0, so the additive cross-partial is positive where Pr(vote Dem) &gt; 0.5 (Democratic identifiers) and negative where it is below 0.5 (Republican identifiers). This is the sign flip in the second differences that follow.

&lt;img src="rainey_example.png" alt="Three-panel line plot illustrating the compression example from Rainey (the image title cites the 2014 working-paper version). Each panel plots Pr(Y) against X from 0 to 1 for Z = 0 (solid) and Z = 1 (dashed). True DGP panel: two parallel straight lines, from 0.30 to 0.50 for Z = 0 and from 0 to 0.20 for Z = 1, so there is no interaction on the probability scale. Logistic (no product term) panel: the gap between the lines grows from about 0.22 to about 0.42 as X increases, an interaction created by the link function. Logistic (with product term) panel: the gap stays near 0.29 to 0.30 at both ends, closer to the true constant gap, although the Z = 1 curve bends upward rather than being straight." width="100%" style="display: block; margin: auto;" /&gt;

## Effect Heterogeneity in GLMs. 

In non-linear GLMs, effect heterogeneity is really about two questions (or two different sets of assumptions). 

1. Is the functional form as estimated adequate (i.e., is a product term needed if not already included)? 
2. Do the effects vary interestingly by subgroup?
