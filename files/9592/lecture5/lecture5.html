## Basic Idea Behind Ordinal Model

Assume that there is a phenomenon we are trying to explain, let's call it `\(y^{*}\)`, that lies on a continuum that we don't observe directly.  



&lt;img src="lecture5_files/figure-html/unnamed-chunk-2-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;


If we did observe it directly, we would simply be able to do a linear regression on `\(y^{*}\)`.  


---


## What We Actually Observe

What we actually observe as `\(y\)`, a more coarse version of `\(y^{*}\)`.  


&lt;img src="lecture5_files/figure-html/unnamed-chunk-3-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;


Everything that falls in between two vertical lines is coded the same value.  For example, everything that falls between `\(\tau_1\)` and `\(\tau_2\)` will be a 2 on `\(y\)`.  


---

## Models for Ordinal Data

The latent variable is modeled as `\(y_{i}^{*} = \mathbf{x}_{i}\mathbf{b} + e_{i}\)`, and the mathematical notation for the measurement model above is

`$$y_{i} = m \mbox{  if  } \tau_{m-1} \leq y_{i}^{*} &lt; \tau_{m} \mbox{  for  } m=\{1,\ldots, J\}$$`

 where `\(\tau_0 = -\infty\)` and `\(\tau_J = \infty\)`, the other `\(J-1\)` cut-points are estimated.

There is no intercept in `\(\mathbf{x}\mathbf{b}\)` ( `\(b_0 = 0\)` ): the thresholds play that role, which identifies the model. 


---

## Probabilities

To characterize `\(Pr(y=m|\mathbf{x})\)` we need to assume a probability distribution for the errors in the latent variable model.
- Our choices here are really either normal (ordered probit) with `\(\sigma^2 = 1\)` or logistic (ordered logit) with `\(\sigma^2 = \frac{\pi^2}{3}\)`.

Because we know (or estimate) all of the `\(\tau\)` parameters, and we have a probability distribution, say the logistic distribution with CDF `\(\Lambda(\cdot)\)`, then we know:

`$$\begin{aligned}
  Pr(y\leq m) &amp;= \Lambda(\tau_{m} - \mathbf{x}\mathbf{b})\\
              &amp;= \frac{1}{1+e^{-(\tau_{m} - \mathbf{x}\mathbf{b})}}
\end{aligned}$$`


---


## Probabilities II

Note that what we get above is the probability of being less than or equal to one particular value.  Let's take the observed value 2. We know that: 

`$$\begin{aligned}
  Pr(y\leq 2) &amp;= \Lambda(\tau_{2} - \mathbf{x}\mathbf{b})
\end{aligned}$$`

What if we wanted to find `\(Pr(y = 2)\)`?  

--

We would need to find: 

`$$\begin{aligned}
Pr(y = 2) &amp;= Pr(y\leq 2) - Pr(y \leq 1)\\
&amp;= \Lambda(\tau_{2} - \mathbf{x}\mathbf{b}) - \Lambda(\tau_{1} - \mathbf{x}\mathbf{b})
\end{aligned}$$`

---


## Likelihood Function

Just like with binary logit models, the likelihood for an individual observation is the probability that the observation takes on its observed value. 

`$$L_i(\mathbf{b}, \boldsymbol{\tau} | y_i, \mathbf{x}_{i}) = \Lambda(\tau_{y_i} - \mathbf{x}_i\mathbf{b}) - \Lambda(\tau_{y_i-1} - \mathbf{x}_i\mathbf{b})$$`


And the log-likelihood is just:

`$$\log L_i(\mathbf{b}, \boldsymbol{\tau} | y_i, \mathbf{x}_{i}) = \log\left(\Lambda(\tau_{y_i} - \mathbf{x}_i\mathbf{b}) - \Lambda(\tau_{y_i-1} - \mathbf{x}_i\mathbf{b})\right)$$`

`$$LL = \sum_{i=1}^{N} \log\left(\Lambda(\tau_{y_i} - \mathbf{x}_i\mathbf{b}) - \Lambda(\tau_{y_i-1} - \mathbf{x}_i\mathbf{b})\right)$$`


---



## Example Data

The example data are about state repression.  
- `sd`: State Department Repression score `\(\{1,2,3,4,5\}\)` (higher = more repression).
- `cwarcow`: COW civil war indicator. 
- `iwarcow`: COW interstate war indicator. 
- `logpop`: Log of population. 
- `logpcgnp`: Log of per-capita GNP. 
- `vanadd`: Additive index of democracy (Vanhanen). 

Other notes: 
  - We use `clm()` from the `ordinal` package, whose `summary()` provides `\(p\)`-values.  The `polr()` function from the `MASS` package doesn't, though an alternative summary function is available in the code file.

---



## Example


``` r
library(ordinal)
library(marginaleffects)
library(tidyr)
dat &lt;- rio::import("data/ologit_data.dta")
dat$sd_fac &lt;- factor(dat$sd, levels=1:5)
mod &lt;- clm(sd_fac ~ cwarcow + iwarcow + logpop + logpcgnp + poly(vanadd, 2), data=dat)
summary(mod)
```

## Interpreting Coefficients: Cumulative Odds Ratios

Because `\(Pr(y \leq j) = \Lambda(\tau_j - \mathbf{x}\mathbf{b})\)`, 

`$$\log\frac{Pr(y &gt; j)}{Pr(y \leq j)} = \mathbf{x}\mathbf{b} - \tau_j$$`

- A one-unit increase in `\(x_k\)` multiplies the odds of being *above any threshold* by `\(e^{b_k}\)` - the same for every `\(j\)` ("proportional odds"). 


``` r
round(exp(coef(mod)[c("cwarcow", "iwarcow", "logpop", "logpcgnp")]), 2)
```

```
##  cwarcow  iwarcow   logpop logpcgnp 
##    19.96     2.55     1.53     0.71
```

- Civil war multiplies the odds of being above any repression level by about 20; a one-unit increase in log GNP/capita multiplies them by 0.71. 
- Polynomial terms (`vanadd`) can't be read this way - use predicted probabilities. 
- The same odds ratio at every threshold *is* the parallel regressions assumption

## Discrete Change

For any variable (and particularly qualitative ones), the discrete change is:

`$$\Delta Pr(y=m|x) = Pr(y=m | x, x_{k} = x_{k}^{\text{end}}) - Pr(y=m | x, x_{k}=x_{k}^{\text{start}})$$`

This simply gives the difference in predicted probability for a discrete change in one `\(x\)`, holding the other `\(x\)`'s constant at particular values.

- **MER** (marginal effect at reasonable values): hold the other `\(x\)`'s at one typical profile (here, medians). 
- **AME** (average marginal effect): make the change for every observation at its observed values, then average. 
- Only `\(Pr(y=1)\)` and `\(Pr(y=J)\)` must move in the direction implied by the sign of `\(b_k\)`; middle categories can rise and then fall.  The changes across categories always sum to zero. 

---


## Example: MER Approach





``` r
mer_comps &lt;- comparisons(mod, newdata = "median",
                         # "2sd": x - 1 SD to x + 1 SD; "iqr": 25th to 75th 
                         # percentile (2sd would push democracy below 0)
                         variables=list(cwarcow = c(0,1), 
                                        iwarcow = c(0,1), 
                                        logpop = "2sd", 
                                        logpcgnp = "2sd", 
                                        vanadd = "iqr"), 
                         type="prob") 
mer_comps %&gt;% 
  # * = 95% confidence interval excludes 0
  mutate(estimate = sprintf("%.2f%s", estimate, ifelse(sign(conf.low) == sign(conf.high), "*", ""))) %&gt;%
  select(term, contrast, group, estimate) %&gt;%
  pivot_wider(names_from = "group", values_from = "estimate")
```

## Ordered Model vs Linear Model

Sometimes, we wonder whether we _could_ estimate a linear model rather than the ordered model. 
- Interpretation is much easier. 
- Effects are not conditional unless specified as such. 

Problems: 
- OLS on the codes `\(1, \ldots, J\)` treats the categories as equally spaced. 
- There is no information in the categorical variable to estimate the residual variance of the latent variable model. 
- The residual variance from a linear model estimated on the categories will not be the residual variance from the latent variable model.

---

## Mathematically

Assume the latent variable `\(y^*\)` has the following equation (no intercept - the thresholds play that role): 

`$$y^* = b_1x + b_2z + e\quad e\sim N(0,\sigma^2)$$`

We can't estimate `\(\sigma\)`, so the probit fixes it at 1.  Dividing through by `\(\sigma\)`: 

`$$\frac{y^*}{\sigma} = \frac{b_1}{\sigma}x + \frac{b_2}{\sigma}z + e^{*}, \quad e^{*}\sim N(0,1), \qquad \text{thresholds } \frac{\tau_j}{\sigma}$$`

So, we actually estimate `\(\mathbf{b}/\sigma\)` and `\(\boldsymbol{\tau}/\sigma\)`: the coefficients are only identified up to the unknown scale `\(\sigma\)`. 

---

## Why the Scale Matters

- Ratios such as `\(b_1/b_2\)` are identified - `\(\sigma\)` cancels. 
- Adding a variable that explains `\(y^*\)` shrinks `\(\sigma\)`, so the other coefficients grow - even if the new variable is unrelated to `\(x\)`. 
- Coefficients aren't comparable across models, samples or groups; changes in predicted probabilities (AMEs) are.  Below: binary logit, `\(x\)` and `\(z\)` independent, 2,500 samples.

## So, Linear or Ordered? 

OLS assumes equally spaced categories.  The ordinal analogue - equally spaced thresholds - is testable: 


``` r
mod_eq &lt;- update(mod, threshold = "equidistant")
eq_lr &lt;- 2*(as.numeric(logLik(mod)) - as.numeric(logLik(mod_eq)))
c(LR = round(eq_lr, 1), df = 2, p = round(pchisq(eq_lr, 2, lower.tail = FALSE), 3))
```

```
##    LR    df     p 
## 6.500 2.000 0.039
```

- Gaps between thresholds: 2.08, 2.05, 1.76 - close to equal, but equal spacing is rejected. 
- Unequal latent variances (later) can make OLS on the codes get even the *sign* of a latent difference wrong (Liddell and Kruschke 2018). 
- Bottom line: OLS summarizes changes in the mean code, `\(E(y)\)`; it doesn't estimate effects on `\(y^*\)`.  Whatever the model, compare effects on the probability scale. 

---

## Parallel Regressions Assumption

The ordered logit is a set of `\(J-1\)` binary logits, one for each threshold, that share the same slopes: 

`$$\text{logit}\,Pr(y\leq j) = \tau_j - \mathbf{x}\mathbf{b}, \qquad j = 1,\ldots,J-1$$`

- The effect of `\(x\)` is the same at every cumulative split (1 vs. 2+, 1-2 vs. 3+, ...) - one set of parallel curves, shifted by `\(\tau_j\)`. 
- A *nominal effect* lets a variable's slope differ by threshold: `\(\text{logit}\,Pr(y\leq j) = \tau_j - \mathbf{x}\mathbf{b}_j\)`. 

The Null and Alternative Hypotheses are: 

- `\(H_{0}\)`: `\(\mathbf{b}_j = \mathbf{b}\)` for every `\(j\)` - the parallel regressions assumption holds. 
- `\(H_{A}\)`: at least one variable's slopes differ across thresholds. 

---

## An Omnibus Test

`nominal_test()` only tests one term at a time.  For an omnibus test, free every slope and compare with the ordered logit: 


``` r
full &lt;- clm(sd_fac ~ 1, nominal = ~ cwarcow + iwarcow + logpop_c + 
  logpcgnp_c + poly(vanadd, 2), data=dat)
omni &lt;- 2*(as.numeric(logLik(full)) - as.numeric(logLik(mod_c)))
data.frame(LR = round(omni, 1), df = 18, 
           p = signif(pchisq(omni, 18, lower.tail = FALSE), 3))
```

```
##      LR df        p
## 1 179.1 18 1.44e-28
```

- `\((J-2) \times K = 3 \times 6 = 18\)` degrees of freedom - the same as the Brant test's omnibus statistic. 
- Freeing every slope can make thresholds cross (negative probabilities).  `clm` only checks at `\(x = 0\)` - another reason to center - so check `full$convergence`.

## Simulation for the Nominal Test

Why simulate? The `\(\chi^2\)` reference is asymptotic, and sparse cells (civil war) might break it.  Generate data where `\(H_0\)` is true (from `mod_c`) and compare.

## What Next? 

Rejecting parallel regressions says the equal-slopes, cumulative structure doesn't fit.  It doesn't say *why*: 

- The variance of `\(y^{*}\)` differs across observations. 
    - `\(\Rightarrow\)` A location-scale model, `clm(..., scale = ~ z)` (next). 
- The predictors work through a single index, but the categories aren't arranged along it the way the ordered logit assumes. 
    - `\(\Rightarrow\)` The stereotype model. 
- The predictors don't work through a single index at all. 
    - `\(\Rightarrow\)` A model with category-specific effects (next week). 

---

## Diagnosing Unequal Latent Variances

**The assumption:** the latent errors are homoskedastic - `\(Var(e_i) = \pi^2/3\)` for every observation (1 for probit). 

- If `\(\sigma_i\)` varies, the model is really estimating `\(\mathbf{b}/\sigma_i\)` (see "Mathematically") - one set of coefficients can't fit every observation. 
- A variance difference can look like a parallel-regressions violation. 

**The diagnostic:** `scale_test()` adds each `\(x\)` to the variance function, one at a time, and LR-tests it ( `\(H_0\)`: the latent variance doesn't depend on `\(x_k\)` ). 


``` r
st &lt;- scale_test(mod)
round(as.data.frame(st)[-1, c("Df", "LRT", "Pr(&gt;Chi)")], 3)
```

```
##                 Df    LRT Pr(&gt;Chi)
## cwarcow          1 13.827    0.000
## iwarcow          1 14.460    0.000
## logpop           1  2.921    0.087
## logpcgnp         1  1.312    0.252
## poly(vanadd, 2)  2  7.069    0.029
```

---

## The Location-Scale Model

Let the spread of the latent errors depend on covariates `\(\mathbf{z}\)`: 

`$$y_i^{*} = \mathbf{x}_i\mathbf{b} + \sigma_i e_i, \qquad \sigma_i = \exp(\mathbf{z}_i\boldsymbol{\gamma}) \quad\Rightarrow\quad Pr(y_i \leq j) = \Lambda\left(\frac{\tau_j - \mathbf{x}_i\mathbf{b}}{\exp(\mathbf{z}_i\boldsymbol{\gamma})}\right)$$`

- No intercept in `\(\mathbf{z}\)`: the baseline variance is still fixed ( `\(\pi^2/3\)` when `\(\mathbf{z} = 0\)` ); `\(e^{\gamma_k}\)` is a *ratio* of latent standard deviations. 
- A scale effect mimics a parallel-regressions violation: if `\(z_k\)` changes `\(\sigma_i\)`, its effect on `\(\text{logit}\,Pr(y \leq j)\)` depends on `\(\tau_j\)`, so `nominal_test()` sees non-parallel slopes for `\(z_k\)`. 
- Location and scale effects of the same variable are separated mostly by functional form - interpret with predicted probabilities (Keele and Park 2006). 

---

## The Stereotype Model

Instead of cumulative probabilities, compare each category to the lowest one (Anderson 1984): 

`$$\log\frac{Pr(y=j)}{Pr(y=1)} = \alpha_j + \phi_j(\mathbf{x}\mathbf{b}), \qquad j = 2,\ldots,J, \quad \phi_1 = 0,\; \phi_J = 1$$`

- `\(\mathbf{x}\mathbf{b}\)` is a single index - one combination of the predictors. 
- `\(\phi_j\)` is category `\(j\)`'s *score*: its position on that index (each category's "stereotype"). 
- `\(b_k\)` is the effect of `\(x_k\)` on the log-odds of the highest vs. lowest category; for categories `\(j\)` vs. `\(m\)` it is `\((\phi_j - \phi_m)b_k\)`. 

---

## Ordered Logit vs. Stereotype on the Same Scale

`$$\log\frac{Pr(y=j)}{Pr(y=1)} = \begin{cases} \alpha_j + h_j(\mathbf{x}\mathbf{b}) &amp; \text{Ordered logit}\\ \alpha_j + \phi_j(\mathbf{x}\mathbf{b}) &amp; \text{Stereotype}\end{cases}$$`

For the ordered logit, with `\(\eta = \mathbf{x}\mathbf{b}\)` and `\(j = 2,\ldots,J-1\)`: 

`$$\alpha_j = \log\left(e^{\tau_j-\tau_1} - e^{\tau_{j-1}-\tau_1}\right), \quad h_j(\eta) = \log\left(1+e^{\tau_1-\eta}\right) - \log\left(1+e^{\tau_j-\eta}\right) - \log\left(1+e^{\tau_{j-1}-\eta}\right)$$`

and for `\(j = J\)`: `\(\alpha_J = 0\)`, `\(h_J(\eta) = \log\left(1+e^{\eta-\tau_1}\right) - \log\left(1+e^{\tau_{J-1}-\eta}\right)\)`.

- Both depend on `\(\mathbf{x}\)` only through the single index `\(\mathbf{x}\mathbf{b}\)` - both are one-dimensional. 
- Ordered logit: nonlinear `\(h_j\)`, whose shape is fixed by the thresholds.  Stereotype: linear in `\(\mathbf{x}\mathbf{b}\)`, scaled by a free `\(\phi_j\)`. 
- Neither nests the other - compare them with AIC/BIC. 

---

## What the Stereotype Model Assumes

- **Kept:** one dimension.  The *relative* effect of any two variables, `\(b_k/b_l\)`, is the same for every pair of categories. 
- **Swapped:** equal slopes on the cumulative-logit scale (parallel regressions) become proportional slopes, `\(\phi_j\mathbf{b}\)`, on the baseline-category scale. 
- **Dropped:** ordering is not imposed.  If `\(\phi_1 &lt; \phi_2 &lt; \cdots &lt; \phi_J\)`, the outcome *behaves* as ordered; if `\(\phi_j \approx \phi_k\)`, `\(\mathbf{x}\)` can't distinguish categories `\(j\)` and `\(k\)`. 
- Fixing equally spaced scores, `\(\phi_j = \frac{j-1}{J-1}\)`, gives the adjacent-category logit, `\(\log\frac{Pr(y=j+1)}{Pr(y=j)} = \alpha_j + \mathbf{x}\mathbf{b}^{*}\)` with `\(\mathbf{b}^{*} = \mathbf{b}/(J-1)\)` - an LR test of equal spacing. 

---

## A Different Question

.pull-left[
**Ordered logit**

- How does `\(\mathbf{x}\)` move observations along a latent continuum, `\(y^{*}\)`, that the thresholds slice into categories? 
- Ordering is a property of `\(y\)` - assumed. 
- `\(\mathbf{b}\)`: shift in `\(y^{*}\)` (up to scale). 
]
.pull-right[
**Stereotype**

- Is there one combination of the predictors that distinguishes the categories, and where does each category fall on it? 
- Ordering is a property of the relationship between `\(\mathbf{x}\)` and `\(y\)` - estimated. 
- `\(\mathbf{b}\)`: effect on the log-odds of the highest vs. lowest category. 
]

Predicted probabilities answer the same substantive question in both models - compare them there. 

---

## Stereotype Model: Repression

.pull-left[

``` r
dat$va &lt;- as.numeric(scale(dat$vanadd))
dat$va2 &lt;- dat$va^2
f &lt;- sd_fac ~ cwarcow + iwarcow + logpop +
  logpcgnp + va + va2
st1 &lt;- VGAM::rrvglm(f, VGAM::multinomial(refLevel=1),
                    data=dat, Rank=1)
# VGAM fixes phi_2 = 1; rescale so phi_5 = 1
phi &lt;- c(0, VGAM::Coef(st1)@A[,1])
setNames(round(phi/phi[5], 2), 1:5)
```

```

## 0.00 0.52 0.76 0.89 1.00
```

- The scores are not equally spaced: categories 4 and 5 are relatively close together. 
- `rrvglm()` is a nonlinear fit (because of `\(\phi_j\mathbf{b}\)`) - check convergence and starting values.

## Comparing the Models


``` r
ac  &lt;- VGAM::vglm(f, VGAM::acat(parallel=TRUE), data=dat)      # equally spaced scores
ll &lt;- c(ologit = as.numeric(logLik(mod)), loc_scale = as.numeric(logLik(mod_ls)), 
        adjacent = logLik(ac), stereotype = logLik(st1))
k  &lt;- c(10, 12, 10, 13)
data.frame(logLik = round(ll, 1), params = k, AIC = round(-2*ll + 2*k, 1), 
           BIC = round(-2*ll + log(nrow(dat))*k, 1))
```

```

## ologit     -2816.0     10 5651.9 5710.3
