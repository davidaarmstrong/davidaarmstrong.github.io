## Goals for This Session

1. From Ordered to Unordered: Stereotype and Reduced-Rank Models
2. Develop Multinomial Logit Model
3. Effects and Effect Displays
4. Model Fit and Evaluation
5. IIA Assumption
6. Conditional Logit
7. Separation Problems

---

## Starting From One Index

Last week's models for ordinal `\(y\)` both work through a single index, `\(\mathbf{x}\mathbf{b}\)`:

`$$\text{Ordered logit:}\quad Pr(y \leq j|\mathbf{x}) = \Lambda(\tau_j - \mathbf{x}\mathbf{b})$$`

`$$\text{Stereotype:}\quad \log\frac{Pr(y=j|\mathbf{x})}{Pr(y=1|\mathbf{x})} = \alpha_j + \phi_j\cdot\mathbf{x}\mathbf{b}, \qquad \phi_1 = 0$$`

- In the ordered logit, the thresholds fix how the index moves `\(y\)` from one category to the next - the order is assumed.
- In the stereotype model, each category gets a free *score*, `\(\phi_j\)`: its position on the index.  The order is estimated, not assumed.
- So nothing in the stereotype model requires `\(y\)` to be ordered: it is a model for unordered outcomes, too.
- One `\(\phi_j\)` is fixed (e.g., `\(\phi_2 = 1\)`) because `\(\phi_j\mathbf{b} = (c\phi_j)(\mathbf{b}/c)\)` for any `\(c \neq 0\)`.

---

## One Dimension for Unordered Outcomes

The log-odds of category `\(j\)` vs. category `\(m\)`:

`$$\log\frac{Pr(y=j|\mathbf{x})}{Pr(y=m|\mathbf{x})} = (\alpha_j - \alpha_m) + (\phi_j - \phi_m)\cdot\mathbf{x}\mathbf{b}$$`

- Every pair of categories is separated by the *same* index, `\(\mathbf{x}\mathbf{b}\)`; only the distance, `\(\phi_j - \phi_m\)`, changes.
    - The relative effect of any two variables, `\(b_k/b_l\)`, is the same for every pair of categories.
- Spatial reading: voters choose on the basis of one combined consideration (e.g., left-right) and the `\(\phi_j\)` place the parties on it.
- If `\(\phi_j \approx \phi_m\)`, `\(\mathbf{x}\)` can't distinguish categories `\(j\)` and `\(m\)`.
- Category `\(j\)`'s slopes, `\(\boldsymbol{\beta}_j = \phi_j\mathbf{b}\)`, are all multiples of one vector: `\(K + (J-2)\)` slopes in all (10 for France, with `\(J = 6\)` and `\(K = 6\)`).

---

## Relaxing One Dimension

Give each category a position in `\(R\)` dimensions (Anderson 1984; Yee and Hastie 2003):

`$$\log\frac{Pr(y=j|\mathbf{x})}{Pr(y=1|\mathbf{x})} = \alpha_j + \sum_{r=1}^{R} a_{jr}\,\eta_{r}, \qquad \eta_{r} = \mathbf{x}\mathbf{c}_r$$`

- `\(R\)` indices `\(\eta_r\)`, each a combination of the predictors; `\(\mathbf{a}_j\)` is category `\(j\)`'s location (baseline at the origin).  `\(R = 1\)` is the stereotype model.
- Slopes become combinations of `\(R\)` vectors, `\(\boldsymbol{\beta}_j = \sum_r a_{jr}\mathbf{c}_r\)`; stacked, `\(\mathbf{B} = \mathbf{A}\mathbf{C}'\)` has rank `\(R\)`.
- Each dimension relaxes the model: `\(R = 1 \subset R = 2 \subset \cdots\)` - the *multidimensional stereotype* or *reduced-rank* model.
- At `\(R = \min(J-1, K)\)` every category gets its own, unrestricted `\(\boldsymbol{\beta}_j\)` (30 slopes for France): the *multinomial logit* (MNL), developed after this section.

---

## Reading the Multidimensional Model

We look at the model as a picture - a *biplot* - with three pieces:

- **Category locations.** Categories close together are ones the predictors can't tell apart; categories far apart are easy to distinguish.  Only *relative* positions matter.
- **Variable arrows.** Each arrow shows how strongly a predictor is related to each axis.  The arrows are correlations, so they stay inside a circle of radius 1, and longer arrows mean stronger relationships.  A predictor pushes people toward the categories its arrow points at, and away from those behind it.
- **Axis shares.** How much of the differences between categories each axis captures.  If the first axis holds most of it, the choice is essentially one-dimensional; a small second axis is a secondary distinction.

Name each axis from the arrows that line up with it and the categories at its ends - much as you would name a factor.

---

## The Stereotype Model as a Diagnostic

Rather than an inferential target, treat the models between the ordered logit and the MNL as a way to *describe* the structure of the choice:

1. **Is there an order?** Do the `\(R=1\)` scores line up with the order we would assume (e.g., the parties' perceived left-right positions)?
1. **Is it evenly spaced?** Equally spaced scores give the adjacent-category logit; close scores mean `\(\mathbf{x}\)` can't tell those categories apart.
1. **How many dimensions?** How much of the MNL's improvement over the intercept-only model does each rank capture?
1. **What are the dimensions?** Which variables define them, and where do the categories sit?
1. **Which distinctions need the extra dimensions?** Which effects - for which categories - only appear as `\(R\)` grows?

All of this is descriptive: we compare fits, scores and pictures - no standard errors required.

---

## From Ordered Logit to MNL

A ladder of relaxations - from one index with an assumed order to unrestricted slopes:

| Model | Slopes for `\(j\)` | Dimensions | Ordering |
|:--|:--|:--|:--|
| Ordered / adjacent-category logit | fixed function of `\(\mathbf{x}\mathbf{b}\)` | 1 | assumed |
| Stereotype | `\(\phi_j\mathbf{b}\)` | 1 | estimated |
| Reduced-rank MNL | `\(\mathbf{C}\mathbf{a}_j\)` | `\(R\)` | none |
| MNL | `\(\boldsymbol{\beta}_j\)` | `\(\min(J-1, K)\)` | none |

- The substantive question: how many distinct considerations does it take to separate the categories?
- Compare the models with LR tests (where nested) and AIC/BIC, then compare their predicted probabilities and first differences.
- We work up the ladder with French vote choice, then develop the unrestricted MNL in detail.

## Where the Picture Comes From

- `rrvglm()` has to fix its dimensions somehow, and it does so with an arbitrary choice of reference categories (its "anchors").  Its raw coefficients depend on that choice, so don't interpret or plot them directly.
- `rr_biplot()` puts any fitted model on a standard footing: the axes are uncorrelated across respondents and ordered from most to least important.  The picture is the same whatever choices `rrvglm()` made.
- The model's fit, predicted probabilities and first differences don't depend on any of this.
- In practice: estimation is iterative, so if `rrvglm()` fails, try different anchors (`Index.corner`).  And like the models later in the lecture, it still assumes IIA (below).

## Which Distinctions Need More Dimensions?: Code


``` r
set_var &lt;- function(data, v, val){
  data[[v]] &lt;- if(is.factor(data[[v]])) factor(rep(val, nrow(data)), levels = levels(data[[v]])) else val
  data
}
pr &lt;- function(m, nd) VGAM::predictvglm(m, newdata = nd, type = "response")
fd &lt;- function(m, v, lo, hi) colMeans(pr(m, set_var(d, v, hi)) - pr(m, set_var(d, v, lo)))
lo &lt;- list(lrself = mean(d$lrself) - sd(d$lrself), union = "no, not a union member",
           age = mean(d$age) - sd(d$age), retnat = "better")
hi &lt;- list(lrself = mean(d$lrself) + sd(d$lrself), union = "yes, union member",
           age = mean(d$age) + sd(d$age), retnat = "worse")
cases &lt;- list(c("lrself", "PS"), c("union", "PCF"), c("age", "Green"), c("retnat", "FN"))
mods &lt;- lad$fits[c("R1", "R2", "R3", "R4", "MNL")]
names(mods) &lt;- c(paste("R =", 1:4), "MNL")
tab &lt;- sapply(mods, function(m) sapply(cases, function(x) fd(m, x[1], lo[[x[1]]], hi[[x[1]]])[[x[2]]]))
rownames(tab) &lt;- sapply(cases, paste, collapse = " -&gt; ")
```

## How Do Voters Choose?

- **A dominant left-right dimension.** It orders the parties roughly as voters perceive them and separates the left and right blocs.  This is the ordered-logit story, and it gets about 3/4 of the way.
- **Within the left, social structure.** PCF vs. PS and the Greens isn't about left-right (axis 2 of the biplot): union members, older voters and economic pessimists stay with the PCF.
- **Group-specific appeals for the small parties.** Young voters and the Greens; economic pessimism and FN, unlike the mainstream right.  Each needs its own dimension because it moves one party, not the blocs.
- **What this means for the model.** An ordered logit is a reasonable first approximation for the blocs, but it misplaces FN and can't capture the small parties' bases.  The MNL is needed for those - and the stereotype ladder tells us which parties and variables require it.

---

## A Workflow

1. **Fit the ladder** with `rr_ladder()`: ordered logit, adjacent-category logit, `\(R = 1, \ldots, J-1\)`.  Use the share of the MNL's fit and AIC/BIC to choose `\(R\)` - roughly the number of distinct *kinds* of options minus one (and at most `\(K\)`).
1. **Check the order:** do the `\(R=1\)` scores follow the order you would assume?  Are they evenly spaced?
1. **Make the biplot** with `rr_biplot()`: check each axis's share.  Plot axes 1-2, and 1-3 if axis 3 isn't trivial.
1. **Read the picture:** structure correlations name the axes; clusters are kinds of options; stacked categories are ones `\(\mathbf{x}\)` can't tell apart.
1. **Choose the model:** an ordered logit if `\(R=1\)` and the order holds; otherwise the MNL (or the reduced-rank model).  Stacked categories are where IIA is most likely to fail - candidate nests for a nested logit (more below).

---

## A Note on Inference

If you do want standard errors for a reduced-rank model:

- Don't rely on the standard errors `rrvglm()` reports for its raw coefficients.  They depend on the arbitrary anchors: simulating from them, Green's 95% interval at `\(R=4\)` is 0.09-0.15 or 0.02-0.67, depending on the anchors.
- Use the bootstrap instead: resample the data, refit starting from the full-sample estimates (`Ainit`, `Cinit`), and drop refits that fail - with cold starts, about 1 in 5 does here.  Bootstrap intervals are the same whatever the anchors.
- For the diagnostic use here, none of this is needed.

## Multinomial Logit

- The MNL model is used when the dependent variable is a set of unordered categories.
- It is the top of the ladder from the first part of the lecture: the same baseline-category logits as the stereotype model, but every category gets its own, unrestricted slopes ( `\(R = J-1\)` ).  The `multinom()` model below is the "MNL" row of the fit table there - the same log-likelihood.
- The adjacent-category and stereotype models are nested in the MNL; the ordered logit is not (it models cumulative probabilities, not baseline-category logits).
- Before, we suggested that there is very little difference between logits and probits - that our inferences will likely be very similar.  In the multinomial case, these are two quite different models that require different estimation techniques and make different sets of assumptions.
  - We will focus exclusively on the multinomial logit (MNL) model here. 

---



## The MNL Model

The MNL model basically works like a bunch of binary logit models. Assume our dependent variable `\(y\)` has `\(J\)` different values, `\(m = 1, 2, \ldots, J\)`. 

- Let's say we want to consider the probability of being a 2 versus the probability of being a 1.  We could do the following: 
    - Subset the data to only those observations where `\(y = \{1,2\}\)`.  
    - Estimate the binary logit model: `\(\log\left(\frac{Pr(y=2|X)}{Pr(y=1|X)}\right) = \mathbf{Xb}\)`.  
- The MNL model basically does this in turn for every value of `\(y\)` in 
`\(\{2, \ldots, J\}\)`. 
    - Each time, estimating `\(\log\left(\frac{Pr(y=m|X)}{Pr(y=1|X)}\right) = \mathbf{Xb}_{m}\)`

---

## The MNL Model

- The group against which we estimate all of the binary logits (i.e., 1 in the example above) is called the reference group.  
- We can calculate probabilities of being in a single group as follows: 
`$$Pr(y=m|X) = \frac{exp(\mathbf{X}\beta_{m})}{\sum_{j=1}^{J}exp(\mathbf{X}\beta_{j})}$$`

- For identification purposes, we set `\(\beta_{1} = \mathbf{0}\)`.  That is, all of the coefficients for the first group are set to zero.  Remember, `\(exp(0) = 1\)`.  


---

## Likelihood Function

Just like in our other models, the likelihood is simply the probability that the observation takes on its observed `\(y\)` value.  We could write this as: 

`$$L(\mathbf{\beta}_{1},\mathbf{\beta}_{2},\ldots,\mathbf{\beta}_{J-1}|\mathbf{X}) = \prod_{m=1}^{J} \prod_{y_{i} = m} \frac{exp(\mathbf{X\beta}_m)}{\sum_{j=1}^{J}exp(\mathbf{X\beta}_j)}$$`

The Log-likelihood function, then, is:

`$$\log L(\mathbf{\beta}_{1},\mathbf{\beta}_{2},\ldots,\mathbf{\beta}_{J-1}|\mathbf{X}) = \sum_{m=1}^{J} \sum_{y_{i} = m} \log\left(\frac{exp(\mathbf{X\beta}_m)}{\sum_{j=1}^{J}exp(\mathbf{X\beta}_j)}\right)$$`

---

## Estimation: multinom

The model can be estimated with the `multinom` function in the `nnet` package.


``` r

    union , data=dat, trace=F)
noquote(t(mnlSig(mod)))
```

## Interpretation: Comparing Coefficients

- Coefficients are in log-odds of voting for the party identified in the row relative to the base category (in `multinom()`, the base category is the first level of the factor; `VGAM` and `mlogit` let you choose it).
- Note that the coefficients relating covariates to non-base-category choices must be considered separately.
- For example, the effect of left-right self-placement on the choice between Greens and Socialists is 0.163, meaning that as left-right increases, voters are more likely to vote for the Green party than the Socialists.

## IIA Assumption

`\(\text{IIA} = \text{Independence of Irrelevant Alternatives}\)`
- The addition or removal of choices from the choice set should not change the odds of choosing one category over another.
- This is forced to be the case in MNL, and in the stereotype and reduced-rank models.  Multinomial probit does not make this assumption.
- Classic example: add a blue bus identical to an existing red bus.  IIA says it draws riders proportionally from every option, when really it should split the red bus's riders.
- Categories stacked together in the biplot - ones the predictors can't tell apart - are where IIA is most likely to fail.  A *nested logit* groups such alternatives into nests and relaxes IIA between them.

---

## Tests for IIA

There are tests for IIA, but Long and Freese argue they shouldn't be used.
- They are not particularly powerful and can often give conflicting results.
- Dow and Endersby suggest that the relaxing the assumption is rarely important and that doing so comes with its own potential set of problems.
- In my own work, I have found that if you are trying to estimate predicted probabilities, both models work about the same.

---


## Conditional Logit

In the MNL models above, all of the variables varied by individual (i.e., they are attributes of the individuals), but not by choice within individual.  
- In this case, there is a coefficient for each choice
Occasionally, there are attributes of the choices we would like to incorporate. 
- In this case, Conditional Logit can be used.

---


## The Model

Remember, before we assumed that the relationship between `\(y\)` and `\(\mathbf{X}\)` was captured with `\(\beta_{m}\)` 

`$$Pr(y=m|X) = \frac{exp(\mathbf{X}\beta_{m})}{\sum_{j=1}^{J}exp(\mathbf{X}\beta_{j})}$$`

where `\(\mathbf{X}\beta_{m} = \beta_{0,m} + \beta_{1,m}X_{1} + \beta_{2,m}X_{2} + \ldots + \beta_{k,m}X_{k}\)`.   By introducing choice-specific information, we need to change the linear predictor to: `\(\mathbf{Z}_{m}\mathbf{\gamma} + \mathbf{X}\beta_{m}\)`.  Notice here, that there are some variables that have an `\(m\)` subscript and those variables only get one coefficient - that is, there is one coefficient relating variable `\(Z_{1}\)` to `\(\mathbf{y}\)` because the information in `\(Z_{1}\)` varies within observations.

## Effect Plots

For conditional logit, there are no canned functions to make effects plots.  Here are the steps you have to apply: 
1. Make the data used to generate predictions (either one fake dataset holding all variables at some hypothetical value or a bunch of datasets each with the variable of interest held constant.)
1. Generate predictions using each dataset. 
1. If confidence intervals are desired, use simulation to calculate sampling variability of the predicted probabilities. 
1. Plot predictions

B &lt;- MASS::mvrnorm(2500, coef(mlogit2), vcov(mlogit2))
lrs &lt;- 0:10
out &lt;- data.frame(

.pull-right[

``` r
for(j in lrs){
  tmp &lt;- dat2l
  tmp$lrself &lt;- j
  X &lt;- model.matrix(
    update(mlogit2, data=tmp))
  
  b &lt;- coef(mlogit2)
  XB &lt;- X %*% t(B)
  Xb &lt;- X %*% b
  p &lt;- prop.table(matrix(exp(Xb), ncol=6, byrow=TRUE), 1)
  m &lt;- colMeans(p)
  
  res &lt;- NULL
  for(i in 1:ncol(XB)){
    exb &lt;- exp(matrix(XB[,i], ncol=6, byrow=TRUE))
    p &lt;- prop.table(exb, 1)
    res &lt;- rbind(res, colMeans(p))
  }
  
  l &lt;- apply(res, 2, quantile, .025)
  u &lt;- apply(res, 2, quantile, .975)
  out$p[which(out$lrself == j)] &lt;- m
  out$lwr[which(out$lrself == j)] &lt;- l
  out$upr[which(out$lrself == j)] &lt;- u
}
out$party &lt;- factor(out$party, levels=levels(dat$vote))
```

B &lt;- MASS::mvrnorm(100, coef(mlogit2), vcov(mlogit2))
tmp &lt;- mlogit2
res &lt;- NULL
for(i in 1:100){
  tmp$coefficients &lt;- B[i,] 
  p_hat0 &lt;- colMeans(predict(tmp, newdata=fake0))
  p_hat1 &lt;- colMeans(predict(tmp, newdata=fake1))
  res &lt;- rbind(res, p_hat1-p_hat0)
}

fd_ame &lt;- as.data.frame(res) %&gt;% 
  summarise(across(everything(), 
                   list(p = ~mean(.x), 
                        lwr = ~quantile(.x, .025), 
                        upr = ~quantile(.x, .975), 
                        pval = ~mean(.x &gt; 0)))) %&gt;% 
  mutate(across(contains("pval"), 
                ~ifelse(.x &gt; .5, 1-.x, .x))) %&gt;% 
  pivot_longer(everything(), 
               names_pattern="(.*)_(.*)", 
               names_to=c("party", ".value"))

## Model Fit

#### PRE

``` r
yhat &lt;- predict(mlogit2,newdata=dat2l)
yhat &lt;- colnames(yhat)[apply(yhat, 1, which.max)]
yhat &lt;- factor(yhat, levels=levels(dat$vote))
obs_vote &lt;- dat2l %&gt;%  filter(vote == 1) %&gt;% ungroup %&gt;% unnest(idx) %&gt;% select(alt) %&gt;% pull()
tab &lt;- table(obs_vote, yhat)
pcp &lt;- sum(obs_vote == yhat)/sum(tab)
pmc &lt;- max(table(obs_vote))/sum(tab)
(pcp-pmc)/(1-pmc)
```

## Separation

Separation can be a problem in unordered categorical models, too.  Let's add `demsat` to the model we ran in the beginning of the lecture:

mods &lt;- multinom(vote ~ lrself + male + retnat + age +
    union + demsat, data=dat, trace=F)
mnlSig(mods)
