## Why Functional Form Matters

Every regression model makes an assumption about the shape of the relationship between `\(x\)` and `\(y\)`.

That assumption can go wrong in a few ways:
- The estimated relationship is too restrictive (e.g., linear when the truth bends).
- The estimated relationship is more complex than it needs to be.
- The estimated relationship imposes (or fails to impose) shape constraints like monotonicity.

--

When it does go wrong, we can get:
- The wrong shape of the relationship.
- Wrong effect sizes, or even the wrong direction, in parts of the range of `\(x\)`.
- Spurious thresholds, turning points, or saturation effects.
- Poor predictions.

--

Flexible models let the data tell us about the shape - but they bring their own choices (knots, smoothing parameters), and a curve fitted to this sample may not generalize to new data.

---

## Functional Form Assumptions. 

When estimating a parametric (linear) model, particularly when interested in the relationship between `\(x\)` and `\(y\)`, we estimate: 

`$$y_i = a + f(x_i) + g(\mathbf{z}_i) + e_i$$`
Where:
- `\(x\)` is a variable of interest
- `\(\mathbf{z}\)` is a vector of covariates.

Usually, `\(f(x)\)` is pre-specified - we choose a particular functional form (linear, polynomial, logged, etc.) before seeing the results.

In this lecture, we focus on some more flexible models for this task. 

---

## Why Not Just Use More Polynomials?

If we want more flexibility, why not just use more polynomial terms? 

- High-order polynomials can oscillate.
- Local changes affect the entire curve.
- Difficult to interpret.

--

Consider the following Example

## Definition of Splines

Splines are: _piecewise regression functions that are constrained to join smoothly at points on the x-axis called knots_

- Rather than fitting a single relationship across the entire range of `\(x\)`, splines fit several local relationships.
- The knots determine where one local relationship gives way to another.
- The constraints ensure that the resulting function behaves as a single smooth curve rather than a collection of disconnected pieces.

---

## Simple Example


.pull-left[
In this simple example, it is easy to figure out what sort of model we want:

- It appears that the relationship between `\(x\)` and `\(y\)` would be well-characterized by two lines.
    - One with a negative slope in the range `\(x = \lbrack 0, 60)\)`
    - One with a positive slope in the range `\(x = \lbrack 60,100\rbrack\)`


These are all the things we need to know right now to model the relationship.

]

## Dummy Interaction

`$$y = b_{0} + b_{1}x_{1} + b_{2}d + b_{3}x\times d + e$$`

This seems like a perfectly reasonable thing to do.  What can it give you though:
]

## Constraining the Piecewise Linear Model

.pull-left[
The problem with the linear interaction model is that it is _too_ flexible.

`$$y = b_{0} + b_{1}x + b_{2}d + b_{3}x\times d + e$$`

This sets up two different equations:

`$$y = \begin{cases}
 d = 0: &amp; b_0 + b_1x\\
 d = 1: &amp; (b_0 + b_2) + (b_1 + b_3)x
 \end{cases}$$`

We need to estimate both slopes, but if we want the lines to join at the knot value, the two model intercepts cannot both be free.
]
.pull-right[
We need the following to be true at knot location `\(k\)`:

`$$\begin{aligned}
b_0 + b_1 k &amp;= (b_0 + b_2) + (b_1 + b_3)k\\
b_0 + b_1 k &amp;= b_0 + b_2 + b_1k + b_3k\\
0 &amp;= b_2 + b_3k\\
b_2 &amp;= -b_3k
\end{aligned}$$`

So once we know the change in slope ( `\(b_3\)` ), the change in intercept is determined - it is not a free parameter.
]

---

## Piecewise Linear Spline

Suppose we define a function as follows:

`$$(x-k)_{+} = \begin{cases}
x-k &amp; \text{ if } x &gt; k\\
0 &amp; \text{ Otherwise}
\end{cases}$$`

We then use that function of `\(x\)` in the model as well. 

`$$y = b_{0} + b_{1}x + b_{3}(x-60)_{+} + e$$`

This sets up essentially 2 equations:

`$$\begin{aligned}
   x \leq 60:&amp; y = b_{0} + b_{1}x\\
   x &gt; 60:&amp; y = b_{0} + b_{1}x + b_{3}(x-60) = (b_{0} + \underbrace{-b_{3}60}_{b2}) + (b_{1}+b_{3})x
\end{aligned}$$`

Notice that here we are only estimating 3 parameters, where the interaction would estimate 4 parameters.  Thus, this is a constrained version of the interaction.


---


## Fixing the Discontinuity


.pull-left[
Including `\(x\)` and `\((x-60)_{+}\)` as regressors, which generates the following predictions:


``` r
pwl &lt;- function(x, k)ifelse(x &gt; k, x-k, 0)

ggplot(mapping=aes(x=x, y=y)) +
  geom_smooth(method="lm",
              formula=y ~ x + pwl(x, 60)) +
  geom_point() +
  theme_minimal()
```
]
.right-shift50[
&lt;img src="lecture8_2026_files/figure-html/unnamed-chunk-3-1.png" alt="Scatter plot of the V-shaped data with a piecewise linear spline (y ~ x + pwl(x, 60)) fitted by geom_smooth(), shown as a line with confidence ribbon. The fitted line changes slope at x = 60 but remains continuous, forming a connected V-shape without the jump seen in the interaction model." width="100%" height="100%" style="display: block; margin: auto;" /&gt;
]



(Note, with piecewise linear functions, we're not constraining the derivatives to be continuous).

## Basis Functions

A basis function is really just a function that transforms the values of `\(x\)`. So, instead of estimating:

`$$y_i = \beta_0 + \beta_1x_i + \varepsilon_i$$`

we estimate:

`$$y_i = \beta_0 + \beta_1s_1(x_i) + \beta_2s_2(x_i) + \ldots +\beta_ks_k(x_i) + \varepsilon_i$$`

The basis functions `\(s_k(\cdot)\)` are known ahead of time (not estimated by the model).
- We can think of polynomials as basis functions where `\(s_j(x_i) = x_i^j\)`
- The piecewise linear function `\((x-k)_{+}\)` is also a basis function. 


---

<script>
(function () {
  var C1 = '#0072B2', C2 = '#E69F00', CF = '#222';
  var beta = [0, 1, 1];

  function b1(x) { return x; }
  function b2(x) { return x * x; }
  function fsum(x) { return beta[0] + beta[1] * b1(x) + beta[2] * b2(x); }

  function niceStep(lo, hi, n) {
    var r = Math.abs(hi - lo) / n;
    if (r < 1e-10) return 0.5;
    var e = Math.floor(Math.log(r) / Math.LN10);
    var f = r / Math.pow(10, e);
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * Math.pow(10, e);
  }

  function yRange(fns) {
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i <= 200; i++) {
      var x = -1 + 2 * i / 200;
      fns.forEach(function(fn) {
        var y = fn(x);
        if (isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); }
      });
    }
    if (!isFinite(lo)) { lo = -1; hi = 1; }
    var pad = Math.max(0.2, (hi - lo) * 0.15);
    return [Math.min(lo - pad, -0.1), Math.max(hi + pad, 0.1)];
  }

  function drawPlot(id, curves, ylo, yhi) {
    var cv = document.getElementById(id);
    if (!cv) return;
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var mg = { t: 8, r: 8, b: 28, l: 40 };
    var pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(mg.l, mg.t, pw, ph);

    function xp(x) { return mg.l + (x + 1) / 2 * pw; }
    function yp(y) { return mg.t + (1 - (y - ylo) / (yhi - ylo)) * ph; }

    var step = niceStep(ylo, yhi, 5);
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    var yg = Math.ceil(ylo / step - 1e-9) * step;
    while (yg <= yhi + 1e-9) {
      ctx.beginPath(); ctx.moveTo(mg.l, yp(yg)); ctx.lineTo(mg.l + pw, yp(yg)); ctx.stroke();
      yg += step;
    }
    [-1, -0.5, 0, 0.5, 1].forEach(function(xv) {
      ctx.beginPath(); ctx.moveTo(xp(xv), mg.t); ctx.lineTo(xp(xv), mg.t + ph); ctx.stroke();
    });
    ctx.setLineDash([]);

    if (ylo < 0 && yhi > 0) {
      ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(mg.l, yp(0)); ctx.lineTo(mg.l + pw, yp(0)); ctx.stroke();
    }

    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
    ctx.strokeRect(mg.l, mg.t, pw, ph);

    ctx.fillStyle = '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    [-1, -0.5, 0, 0.5, 1].forEach(function(xv) {
      ctx.fillText(xv === 0 ? '0' : xv.toFixed(1), xp(xv), mg.t + ph + 12);
    });
    ctx.fillText('x', mg.l + pw / 2, H - 1);
    ctx.textAlign = 'right';
    yg = Math.ceil(ylo / step - 1e-9) * step;
    while (yg <= yhi + 1e-9) {
      ctx.fillText(Math.abs(yg) < 1e-9 ? '0' : yg.toFixed(1), mg.l - 4, yp(yg) + 4);
      yg += step;
    }

    curves.forEach(function(c) {
      ctx.strokeStyle = c.color;
      ctx.lineWidth = c.lw || 2;
      ctx.setLineDash(c.dash || []);
      ctx.globalAlpha = c.alpha !== undefined ? c.alpha : 1;
      ctx.beginPath();
      var first = true;
      for (var i = 0; i <= 300; i++) {
        var x = -1 + 2 * i / 300;
        var y = c.fn(x);
        if (!isFinite(y)) { first = true; continue; }
        var px = xp(x), py = yp(Math.max(ylo - 0.5, Math.min(yhi + 0.5, y)));
        first ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        first = false;
      }
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
  }

  function update() {
    var wb1 = function(x) { return beta[1] * b1(x); };
    var wb2 = function(x) { return beta[2] * b2(x); };

    var yr1 = yRange([b1, b2, wb1, wb2]);
    drawPlot('bfd-c1', [
      { fn: b1,  color: C1, lw: 1.5, dash: [5, 3], alpha: 0.2 },
      { fn: b2,  color: C2, lw: 1.5, dash: [5, 3], alpha: 0.2 },
      { fn: wb1, color: C1, lw: 2.5 },
      { fn: wb2, color: C2, lw: 2.5 }
    ], yr1[0], yr1[1]);

    var yr2 = yRange([fsum, wb1, wb2]);
    drawPlot('bfd-c2', [
      { fn: wb1,  color: C1, lw: 1.5, dash: [5, 3], alpha: 0.35 },
      { fn: wb2,  color: C2, lw: 1.5, dash: [5, 3], alpha: 0.35 },
      { fn: fsum, color: CF, lw: 3 }
    ], yr2[0], yr2[1]);

    var sgn = function(v) { return v >= 0 ? '+' : ''; };
    document.getElementById('bfd-eq').innerHTML =
      'f(x) = ' + beta[0].toFixed(1) +
      ' <span style="color:' + C1 + '">' + sgn(beta[1]) + beta[1].toFixed(1) + 'x</span>' +
      ' <span style="color:' + C2 + '">' + sgn(beta[2]) + beta[2].toFixed(1) + 'x²</span>';
  }

  ['bfd-s0', 'bfd-s1', 'bfd-s2'].forEach(function(id, i) {
    var sl = document.getElementById(id);
    var vd = document.getElementById('bfd-v' + i);
    if (!sl) return;
    sl.addEventListener('input', function() {
      beta[i] = parseFloat(sl.value);
      vd.textContent = beta[i].toFixed(1);
      update();
    });
  });

  update();
}());
</script>

## Piecewise Polynomials

The piecewise linear model is useful in situations like the one we encounter here, but it is insufficiently flexible to capture a wide array of non-linear relationships.  Higher-order piecewise polynomials can. 

`$$y_i = \left\{\begin{array}{lc}
  \beta_{01} + \beta_{11}x_i + \beta_{21}x_i^2 + \beta_{31}x_i^3 + \varepsilon_i &amp; x_i &lt; c\\
  \beta_{02} + \beta_{12}x_i + \beta_{22}x_i^2 + \beta_{32}x_i^3 + \varepsilon_i &amp; x_i \geq c
\end{array}\right.$$`

Just as above though, these polynomials are unconstrained and can generate a discontinuity at the *knot* location `\(c\)`.

---

## Constraining the Piecewise Polynomial Model

To constrain the model, the splines are constructed:

- such that the first and second derivatives of the function continuous.

- Each constraint reduces the number of per-knot degrees of freedom used by one.

- In general, the model uses: Polynomial Degree `\(+\)` \# Knots `\(+\)` 1 (for the intercept) degrees of freedom


---

## Truncated Power Basis Functions

The easiest set of spline functions to consider (for knot location `\(k\)` and polynomial degree `\(p\)`) are called truncated power functions, defined as:

`$$h(x, k) = (x - k)_{+}^{p} = \left\{\begin{array}{ll}(x-k)^{p} &amp; \text{if } x &gt; k\\ 0 &amp; \text{otherwise}\end{array}\right.$$`

When using these basis functions, we include the full (i.e., global) polynomial of degree `\(p\)` and one truncated power function of degree `\(p\)` for each knot.  For a cubic spline, `\(p=3\)`.

---

## Other Spline Bases

The truncated power basis is useful for understanding how splines work.

In practice, other spline bases are often used:

- B-splines: numerically stable, local support.
- Natural splines: constrain behavior in the tails.
- Thin-plate splines: commonly used in GAMs.

--

All of these produce similar fitted functions.

The primary differences concern computational efficiency, numerical stability, and behavior at the boundaries.

## What Spline Choices Matter?

| Choice              | Typical Importance   |
|---------------------|----------------------|
| Knot Placement      | Usually Low          |
| Polynomial Degree   | Usually Low - 2 or 3 |
| Number of Knots     | Moderate             |
| Smoothing Parameter | High                 |

--

Simulation studies and practical experience suggest that cubic splines are generally sufficient and that knot placement is rarely critical.

The primary concern is controlling flexibility.

---

## Choosing the Number of Knots

More knots make the spline more flexible.

- Too few knots may miss important features of the relationship.
- Too many knots may fit noise rather than signal.

How should we choose?

--

One possibility is cross-validation.

---

## Cross-Validation

1. Randomly divide the data into `\(V\)` groups (folds).
2. Fit the model using `\(V-1\)` groups.
3. Predict the omitted group.
4. Calculate prediction error.
5. Repeat omitting the next group until every group has been omitted once.
6. Repeat steps 1–5 multiple times using different random partitions of the data and average the resulting prediction errors.

Choose the model with the lowest average prediction error.

_Idea:_ A good model should predict observations it has not seen.

---

## What Cross-Validation Does (and Doesn't) Tell Us

Cross-validation does not tell us which model is "correct."

Instead, it helps identify a reasonable level of complexity.

- Too little flexibility may miss meaningful structure.
- Too much flexibility may fit noise.

It is a guide for choosing flexibility, judged by how well the model predicts data it hasn't seen.

---


## Tidy CV

.pull-left[

``` r
cv_fun &lt;- function(split) {
  train &lt;- analysis(split)
  test  &lt;- assessment(split)
  ## knots at evenly spaced quantiles of x
  mods &lt;- lapply(1:10, \(k) {
    q     &lt;- seq(0, 1, length.out = k + 2L)[-c(1L, k + 2L)]
    knots &lt;- quantile(train$x, q, na.rm = TRUE)
    lm(y ~ tpb(x, knot_loc = knots), data = train)
  })
  ## out-of-sample prediction errors
  errs &lt;- lapply(mods, \(m)
    test$y - predict(m, newdata = test))

  tibble(
    sse     = sapply(errs, \(e) sum(e^2)),
    n       = nrow(test),
    n_knots = 1:10
  )
}
library(purrr)
library(rsample)
set.seed(519)
v &lt;- vfold_cv(df, v=5, repeats=250) |&gt;
  mutate(err = map(splits, cv_fun))
```

Looks like five knots is the best.

## Regression Spline Takeaways

1. The regression spline finds non-linearity in a relatively narrow but well-populated region of the data (oil below about 0.75).
    - If that pattern is real, the linear model mis-states the effect of oil there.
2. Global polynomial models would struggle to capture this pattern.
    - The non-linearity is localized rather than affecting the entire support of the variable.
3. Quantile-based knot placement allocates flexibility where the data are concentrated.
    - This is particularly useful for highly skewed variables.
4. The evidence for the local bend is modest.
    - The F-test rejects linearity, but the CV error barely changes across models, so the bend helps out-of-sample prediction only a little.


## Why Not Stop at Regression Splines. 

Regression splines can be quite useful. Why do we need anything else?

- Regression splines can be inefficient, particularly when many knots are required to capture complex relationships.

- Regression splines require several analyst choices:

    - Number of knots
    - Location of knots

- These choices can be guided by theory and evidence, but they remain somewhat arbitrary.

    - The flexibility of the model is concentrated around the chosen knots.

    - Detecting localized non-linearity therefore depends, in part, on where those knots are placed.

---

## Smoothing Splines

.pull-left[
Smoothing splines mitigate these problems somewhat: 

- Use lots of knots (up to one per unique `\(x\)`).
- Penalize excess curvature.

`$$\begin{aligned}
y_i &amp;= b_0 + b_1x_i + b_2 x_i^2 + b_3x_i^3 \\
&amp;+ \sum_{j=1}^{J}g_{j}(x_i-k_j)_+^3 + e_i
\end{aligned}$$`

with `\(J\)` knots at locations `\(k_j\)`.  If all `\(g_j = 0\)`, this is the global cubic; non-zero `\(g\)`s let the fit deviate from it.
]
.right-shift100[
&lt;img src="images/oprah_knots.png" alt="Meme based on the Oprah Winfrey 'You Get a Car' giveaway, with the text changed to 'YOU GET A KNOT / YOU GET A KNOT / YOU GET A KNOT / EVERYBODY GETS A KNOT', humorously illustrating the smoothing-spline strategy of placing a knot at every unique value of x." width="70%" style="display: block; margin: auto;" /&gt;
]

---

## Back to OLS

OLS solves the following:

`$$\underset{b}{\text{arg min}}\sum_i^N(y_i - \mathbf{x}_{i}\mathbf{b})^2$$`

It finds the coefficients `\(\mathbf{b}\)` that minimize the residual sum of squares.
- The only thing that matters is model fit subject to the constraint of linearity in the parameters.

---

## Penalized Estimation

.pull-left[
Smoothing splines solve a related, but more complex problem:

`$$\underset{[b,g]}{\text{arg min}}\underbrace{\sum_i^N(y_i - \hat{y}_i)^2}_{\text{Lack of Fit}} + \underbrace{\lambda \int \lbrack f^{\prime\prime}(x)\rbrack^2 dx}_{\text{Wiggliness Penalty}}$$`

Where `\(\hat{y}_i = f(x_i)\)` is the spline defined on the previous slide:

`$$\begin{aligned}
\hat{y}_{i} &amp;=  b_0 + b_1x_i + b_2 x_i^2 + b_3x_i^3 \\
&amp;+ \sum_{j=1}^{J}g_{j}(x_i-k_j)_+^3
\end{aligned}$$`
]
.right-shift50[
- `\(\lambda\)` is a _tuning parameter_ that governs how much weight the penalty is given.
    - `\(\lambda=0\)` recovers the unpenalized (very wiggly) regression spline.
    - Larger `\(\lambda\)` values mean smoother curves.

- The penalty measures curvature ( `\(f^{\prime\prime}\)` ).  The only functions with _no_ curvature are straight lines.
    - As `\(\lambda \rightarrow \infty\)`, the fit approaches the **linear** regression of `\(y\)` on `\(x\)` (not the global cubic).
    - So the smoothing spline nests the linear model - which is why an edf of 1 means "linear."
]

???

Penalizing the g coefficients directly (lambda * sum g_j^2, a ridge penalty) would instead shrink toward the global cubic.  GAM software uses curvature-type penalties.

Regression splines control flexibility by limiting the number of knots, smoothing splines do so by penalizing curvature.

---

## Who picks `\(\lambda\)`?

We have replaced several modeling choices (number and location of knots) with a single smoothing parameter, `\(\lambda\)`.

**Methods for Choosing `\(\lambda\)`**

- (Generalized) Cross-validation
- Random effects shrinkage (REML)

---

## Generalized Additive Models

GAM extend smoothing splines to the multiple regression context.

`$$y_i = b_0 + f(x_i) + g(z_i) + e_i$$`

In practice, GAM software:

- constructs spline bases,
- estimates smoothing parameters,
- applies smoothness penalties,
- returns fitted smooth functions.

---

## Estimating GAMs

We will use the `gam()` function from the `mgcv` package to estimate GAMs.

- Use `method = "REML"` to estimate the smoothing parameters as random effects - currently preferred method.
- Use `s(x)` to estimate a smooth for a variable.
    - The argument `k` identifies the size of the basis (roughly, the number of knots).
    - The argument `bs` identifies the type of basis (default `"tp"`, thin-plate; `"cr"` is a cubic regression spline with knots at quantiles of `\(x\)`).
    - The argument `fx` is logical indicating whether the spline should be penalized (`FALSE`) or unpenalized (`TRUE`).

---

## Choosing the Basis Dimension `k`

`k` sets the _maximum_ flexibility of a smooth; the penalty decides how much of it is used.

- A smooth with basis dimension `k` can use at most `k - 1` effective degrees of freedom (one is lost to the identifiability constraint).
- If `k` is too small, the smooth cannot bend enough and we over-smooth - the penalty can't add flexibility that isn't in the basis.
- If `k` is larger than needed, the results barely change - the penalty shrinks away the extra flexibility.  The cost is computation time (roughly proportional to `\(nk^2\)`).
- `k` can't exceed the number of unique values of `\(x\)` (e.g., Polity has 21).

--

**In practice:** start with the default (`k = 10`), check whether the smooth is pushing against its ceiling (`k.check()`, below), and if so, double `k` and see whether the fit changes.  The `k = 200` in the next example is far more than necessary (it uses about 2 df) - it's there to make the point that `k` is a ceiling, not a target.

---

## Why Did the GAM Miss the Bend?

The penalty `\(\lambda \int \lbrack f^{\prime\prime}(x)\rbrack^2 dx\)` has two features that matter here:

1. **It is measured in the units of `\(x\)`.**  Oil runs from 0 to about 116, but half of the observations are below 0.54.  A bend between 0 and 0.15 is extremely "wiggly" on that scale.
2. **It uses a single `\(\lambda\)` for the whole range of `\(x\)`.**  The `\(\lambda\)` that keeps the curve smooth across the sparse upper range also flattens the dense lower range.

The B-spline didn't have this problem because its knots were placed at quantiles of oil - its flexibility was concentrated where the data are.

--

Two ways to deal with this:
- Transform `\(x\)` (e.g., `\(\log\)`) so that the penalty operates on a more sensible scale.
- Let the amount of smoothing vary with `\(x\)` - an **adaptive smooth**.

---

## Adaptive Smooths

.pull-left[
In an adaptive smooth (`bs = "ad"`), the penalty is `\(\int \lambda(x) \lbrack f^{\prime\prime}(x)\rbrack^2 dx\)` - the smoothing parameter is itself a smooth function of `\(x\)`.

- `m` is the number of basis functions used to represent `\(\lambda(x)\)` (default 5) - i.e., how many separate smoothing parameters get estimated.
- `xt = list(bs = "cr")` builds it on a cubic regression spline, which places knots at quantiles of `\(x\)`.
- Costs: many more smoothing parameters, slower estimation, and it needs a lot of data to estimate `\(\lambda(x)\)` well.
]
.pull-right[

``` r
ross_form_ad &lt;- as.formula(
  regime1 ~ regime1_lag5 +
    s(oil_lag5, bs="ad", k=40, m=10,
      xt=list(bs="cr")) +
    metal_lag5 + log135_lag5 + islam_lag5 +
    oecd_lag5 + Food_lag5)

ross_ad &lt;- gam(ross_form_ad, data=ross,
               method = "REML")
tidy(ross_ad)
```

## Monotonicity in GAMs

So far, we have distinguished two kinds of departures from linearity: monotone non-linearity and non-monotone non-linearity.
- We can relax the assumption of constant marginal effects in favor of something more flexible.
- In many of the models we looked at above, the more flexible models permitted a wide range of non-monotone non-linear effects.
- Sometimes we may want to relax the constant marginal effect assumption, but retain the monotonicity (or some other shape) assumption.

--

Enter: Shape Constrained Additive Models

---

## Shape-Constrained GAMs (SCAMs)

Sometimes theory tells us more than simply "the relationship is non-linear."

Theory may imply that the relationship is:

- Monotonically increasing
- Monotonically decreasing
- Convex
- Concave

--

Examples:

- Income and consumption should generally be non-decreasing.
- Education should not reduce literacy.
- State capacity should not decrease tax collection.

A Shape-Constrained Additive Model (SCAM) estimates a smooth function while enforcing these restrictions.

???

If these constraints are theoretically justified, allowing arbitrary non-linearity may generate implausible alternatives.

## SCAM Estimation and Interpretation

.pull-left[

``` r
library(scam)
mod_scam &lt;- scam(
  y ~ s(x, bs = "mpi"),
  data = dat
)
```

Possible values for `bs` are:
- "mpi" - monotone increasing
- "mpd" - monotone decreasing
- "cx" - convex
- "cv" - concave

]
.pull-right[
The estimation procedure is similar to a GAM:

- Smoothness is still controlled by a penalty.
- Shape constraints restrict the space of allowable functions.
- The fitted function is the smoothest function that both fits the data and satisfies the constraint.
- Permits relaxing pre-specified functional form while retaining potentially theoretically important structure.

]

## Oil and Democracy Takeaways

1. The spline and the adaptive GAM both find a local bend at low levels of oil, and the adaptive GAM has the lowest AIC of all the models.
    - The ordinary GAM and SCAM miss it because a single, global smoothing parameter on the raw oil scale flattens it - not because the data reject it.
2. Beyond about 1, all the models agree closely.  The ordinary GAM differs only at the very sparse upper end of oil production, where uncertainty is large.
3. Across the models, the main story is the same: more oil production is associated with less democracy across most of the observed range of oil.
4. **General lesson:** a smoothing penalty is not neutral - it depends on the scale of `\(x\)`.  For highly skewed variables, consider transforming `\(x\)`, using a basis with quantile knots, or using an adaptive smooth.

## GAMs Beyond the Linear Model

Just like `glm()`, `gam()` takes a `family` argument.  Some useful ones:

| Outcome | Family |
|:--|:--|
| Binary | `binomial` |
| Counts | `poisson`, `nb()` (negative binomial) |
| Ordinal | `ocat(R = # categories)` |
| Unordered categorical | `multinom(K = # categories - 1)` |
| Survival | `cox.ph()` |
| Proportions | `betar()` |

`scam()` also supports `binomial` and `poisson`.

--

Smooths are estimated on the **linear predictor** scale (e.g., the logit): edf = 1 means linear in the logit, still non-linear in the probability.  Use `marginaleffects` for the response scale.

## Checking a GAM: What Can Go Wrong

1. **The basis is too small.**  If `k` is too small, the smooth hits its ceiling and over-smooths.
    - Signs: edf close to `k'` (the maximum), and residuals that still show a pattern against `\(x\)`.
    - `k.check()` compares the residual variance between neighboring observations (in `\(x\)`) to the overall residual variance.  A k-index well below 1 with a small p-value suggests a pattern left in the residuals.
2. **Concurvity** - the non-parametric analogue of collinearity.
    - One smooth can be well approximated by (combinations of) the other terms in the model, so its shape is poorly identified and its intervals are wide.
    - Measured from 0 (none) to 1 (complete).  Values above about 0.8 are worth worrying about.
3. **The usual model diagnostics still apply** - the distribution of the residuals, the mean-variance relationship, influential observations.  Smooths do not fix a misspecified family.

---

## Interpreting Uncertainty in Smooths

- **edf** (effective degrees of freedom) summarizes how flexible a smooth is.  For the default bases, edf = 1 is a straight line.
- **p-values** for smooths test whether `\(f(x) = 0\)` everywhere.  They are approximate, and a significant smooth is not necessarily a non-linear one - compare the edf, or compare to a parametric model with AIC.
- **Confidence bands** come from a Bayesian (posterior) covariance matrix.
    - They have good _average_ coverage across the function, not necessarily at every individual value of `\(x\)`.
    - By default, they treat the smoothing parameter as known.  `vcov(model, unconditional = TRUE)` (or `plot(model, unconditional = TRUE)`) also accounts for uncertainty about `\(\lambda\)`.
- Bands are narrowest where the data are dense and widen quickly where data are sparse - always plot a rug.

## Key Lesson

We can never be sure we have found the "correct" functional form.

Flexible models let us see whether our substantive conclusions depend on the functional form we assumed.

- Linear models impose strong assumptions.
- Flexible models relax those assumptions (and introduce new ones) - as the oil example shows, even the smoothing penalty is an assumption.
- Conclusions that hold up across reasonable functional forms deserve more confidence.

---

## Problems With Linear Interactions

Consider the following model:

`$$y = a + b_{1}X + b_{2}D + b_{3}X\times D + e$$`

Hainmueller, Mummolo and Xu argue that our linear interaction models like above suffer from two potential problems:

- The conditional partial effect of each variable is a linear function of the other: `\(b_{D|X} = b_{2} + b_{3}X\)`.  Thus for every additional unit of `\(X\)` the effect of `\(D\)` changes by the same amount.

- Support - most political scientists do not pay attention to the joint density of the interacting variables and what the implies about our ability to make inferences.


---

## Linearity

Again, using the same model

`$$y = a + b_{1}X + b_{2}D + b_{3}X\times D + e$$`

Consider two different values of `\(D: \{d_{1}, d_{2}\}\)`, the effect of this contrast is:

`$$\begin{aligned}
    \hat{Y}(D=d_{1}|X) - \hat{Y}(D=d_{2}|X) =&amp;  (a + b_{1}X + b_{2}d_{1} + b_{3}Xd_{1})\\
    &amp; - (a + b_{1}X + b_{2}d_{2} + b_{3}Xd_{2})\\
    =&amp; b_{2}(d_{1}-d_{2}) + b_{3}X(d_{1}-d_{2})
\end{aligned}$$`

The effect will only be appropriately estimated if *both* functions of `\(X\)` (for `\(d_{1}\)` and `\(d_{2}\)` are linear).



---

## Support

`$$b_{2}(d_{1}-d_{2}) + b_{3}X(d_{1}-d_{2})$$`


The equation above makes it clear that to reliably estimate the treatment:


- We must have reasonable data density at both `\(d_{1}\)` and `\(d_{2}\)` for each value of `\(X\)`.

- Failure of this condition results in interaction effects that are a function of interpolation and extrapolation.




---

## Binning Estimator for Interaction Effects

- Discretize `\(X\)` into three bins using its terciles ( `\(\delta_{\frac{1}{3}}\)` and `\(\delta_{\frac{2}{3}}\)` ).

`$$G_{1}=\left\{\begin{array}{ll}
        1, &amp;\text{ if }X &lt; \delta_{\frac{1}{3}}\\
        0, &amp;\text{ Otherwise }
    \end{array}\right. \text{ }
    G_{2}=\left\{\begin{array}{ll}
        1, &amp;\text{ if }\delta_{\frac{1}{3}} \leq X &lt; \delta_{\frac{2}{3}}\\
        0, &amp;\text{ Otherwise }
    \end{array}\right.\text{ }
    G_{3}=\left\{\begin{array}{ll}
        1, &amp;\text{ if }X \geq \delta_{\frac{2}{3}}\\
        0, &amp;\text{ Otherwise }
    \end{array}\right.$$`


- Pick an evaluation point, `\(x_{j}\)`, in each of the `\(J\)` bins (usually the median of the `\(x\)` values within the bin)

- Estimate the model:

`$$Y = \sum_{j=1}^{J} \left\{u_{j} + \alpha_{j}D +\eta_{j}(X-x_{j}) + \beta_{j}(X-x_{j})D\right\}G_{j} + \ldots + \varepsilon$$`


---

## Advantages over Linear Interaction Effect


- More flexible for non-linear functional forms.  It fits separate interactions to each bin.

- Since `\((X-x_{j}) = 0\)` at the evaluation point, the partial conditional effect within each bin is just `\(\alpha_{j}\)`.

- Binning ensures that there is sufficient joint support on `\(X\)` and `\(D\)` since they are constructed from `\(X\)`.

- This model nests the linear interaction model, so it can serve as a test of the linear interaction effect model.

---

## Testing for Linear Interaction Effect

We could recast the model above (the binning estimator one) to be:

`$$\begin{aligned}
    Y =&amp; \mu + \alpha D + \eta X + \beta DX + G_{2}(\mu_{2^{\prime}} + \alpha_{2^{\prime}} D + \eta_{2^{\prime}} X + \beta_{2^{\prime}} DX)\\
       &amp; + G_{3}(\mu_{3^{\prime}} + \alpha_{3^{\prime}} D + \eta_{3^{\prime}} X + \beta_{3^{\prime}} DX)
\end{aligned}$$`

Here, the primed coefficients are the differences between bins 2 and 3 and bin 1.  If they are all zero, the model collapses to the linear interaction model. 

We can then use a Wald test (i.e., F-test) to test whether all of the primed coefficients ( `\(\mu_{j^{\prime}}, \alpha_{j^{\prime}}, \eta_{j^{\prime}}, \beta_{j^{\prime}}\)` for `\(j = 2, 3\)` ) are simultaneously zero.

## Non-linearity or Interaction? 

.pull-left[
The binning test compares bin-specific _linear_ models in income to a single linear interaction.  It rejects if the effect of income changes across bins of education - _or_ if income itself has a non-linear effect.

The binning test can't tell a non-linear effect of `\(D\)` from a non-linear interaction.  It is a test of the whole parametric specification, not just of the interaction.

## Smooth Interactions with GAMs

The binning estimator is still piecewise linear.  A GAM lets the conditional relationship be a smooth function.

For a binary moderator `\(D\)`, estimate a separate smooth of `\(X\)` for each value of `\(D\)`:

`$$y_i = b_0 + b_1D_i + f_0(X_i)(1-D_i) + f_1(X_i)D_i + \ldots + e_i$$`

The effect of `\(D\)` at `\(X = x\)` is then `\(b_1 + f_1(x) - f_0(x)\)`, which can take any smooth shape.

- In `mgcv`, this is `s(X, by = Df)` where `Df` is a factor (the factor main effect must also be in the model).
- The penalty's null space includes the linear function, so if the smooths come back with edf `\(\approx 1\)`, the data are telling us the linear interaction was fine.

---

## Two Continuous Variables: Tensor Products

When both moderator and focal variable are continuous, we need a smooth _surface_ `\(f(X, Z)\)`.

- `te(X, Z)` - a tensor product smooth of `\(X\)` and `\(Z\)` jointly.
- `ti(X) + ti(Z) + ti(X, Z)` - the same surface decomposed into two main-effect smooths and a pure interaction smooth.
    - This is the smooth analogue of `X + Z + X:Z`.
    - The `ti(X, Z)` term gives a direct test of whether there is _any_ interaction beyond the additive smooths.
- Tensor products are scale-invariant, so it doesn't matter that `\(X\)` and `\(Z\)` are measured in different units (unlike `s(X, Z)`, which is isotropic).

## Flexible Models Need Assumptions, Too

Flexible models replace strong assumptions with weaker or different ones, but do not get rid of assumptions altogether.

|         Model        |           Key Assumption         |
|:--------------------:|:--------------------------------:|
|   Linear             |   Constant marginal effect       |
|   Polynomial         |   Global shape                   |
|   Regression spline  |   Knot structure                 |
|   GAM                |   Smoothness penalty             |
|   SCAM               |   Smoothness + shape constraint  |
|   Binning estimator  |   Linearity within bins          |
|   Smooth interaction |   Smoothness + common support    |

---

## Flexible Functional Form Workflow: Numeric Variables

1. Estimate the baseline (parametric) model.
2. Estimate a GAM (and a SCAM if theory implies a shape constraint) with `mgcv::gam()` / `scam::scam()`.
    - If smoothing splines are not available for your model, use regression splines + CV for knot selection.
    - For highly skewed variables, consider an adaptive smooth (or a transformation of `\(x\)`).
3. Check the GAM: is `k` big enough (`k.check()`, doubling `k`) and is concurvity a problem?
4. Compare effects across models using predictions or first differences.
5. Describe where (in the range of `\(x\)`) and how the relationships differ.

Comparing the models tells us which assumptions matter - constant marginal effect and/or monotonicity.

---

## Flexible Functional Form Workflow: Interactions

1. Check joint support of the interacting variables (raw plots).
2. Compare the linear interaction to a binning estimator and a smooth interaction (`s(X, by=D)` or `ti()`).
    - Remember that the binning test also picks up non-linearity in the treatment itself, so get the main-effect functional form right first.
3. Report conditional effects only where there is common support.

---

1. Regression splines and basis functions
2. Cross-validation for choosing flexibility

4. Shape-constrained GAMs
5. Linear interactions: linearity and support
6. Binning estimators and smooth interactions
