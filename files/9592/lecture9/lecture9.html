## Goals for This Session

1. What are the consequences for our models of having *dependent* data?
2. When we have dependent data, we can make hypotheses about within-unit effects and between-unit effects, what are the consequences of this choice?
3. When we use unit effects to deal with dependent data, are we better off using fixed or random unit effects - and does the choice matter once we separate within and between effects?
4. How do we extend the model to varying slopes, few groups and non-linear (GLM) outcomes?

---


## Dependent Data

Multilevel data are different than the data we have considered thus far as they have observed data at different levels of aggregation.  Some examples:
- Voters in constituencies, in regions
- Survey respondents in countries (e.g., WVS, CSES, ESS)
- Legislators in parties, in legislatures
- Children in classrooms, in schools, in districts

The prominent feature here is that observations can be thought of as "nested" in groups.
- These groups can have attributes of their own that we might care about.
- Observations in the same group share unobserved influences, so they are more similar to each other than to observations in other groups.

---


## The Independence Assumption

- Recall that OLS assumes that each observation is independent of the others
- More specifically, the error term, or equivalently the Y-values conditional on `\(X\)`, are independent of each other
- Although the assumption of independence is rarely perfect, in practice a simple random sample from a large population provides a close approximation
- Clustered samples (e.g., sample constituencies, then voters) and data that pool groups (e.g., cross-national surveys) often do not satisfy this condition
- If independence is violated, two things go wrong:
  - *Inference*: the usual OLS standard errors are wrong - usually too small, especially for variables that vary mostly between groups.
  - *Efficiency*: OLS is no longer the best linear unbiased estimator; a model of the dependence (GLS/random effects) can do better.
- The OLS coefficients themselves are still unbiased *if* the shared group component is unrelated to `\(X\)` - and that "if" is a big part of today's story.

---

## How Much Does Dependence Matter?

.pull-left[
The *intraclass correlation* (ICC) is the share of the variance in `\(Y\)` that is between groups - equivalently, the correlation between two observations in the same group:

`$$\rho = \frac{\tau_{0}^{2}}{\tau_{0}^{2} + \sigma^{2}}$$`

With groups of average size `\(\bar{n}\)`, the *design effect* for a mean is

`$$\text{deff} = 1 + (\bar{n}-1)\rho, \quad n_{\text{eff}} = \frac{N}{\text{deff}}$$`
]
.pull-right[
For a regression slope, the variance inflation is approximately (Moulton 1990):

`$$\frac{V_{\text{true}}(b)}{V_{\text{OLS}}(b)} \approx 1 + (\bar{n}-1)\rho_{x}\rho_{e}$$`

- `\(\rho_{e}\)`, `\(\rho_{x}\)`: ICCs of the errors and of `\(x\)`.
- Group-level variables ( `\(\rho_{x}=1\)` ) take the full hit; purely within-group variables ( `\(\rho_{x}\approx 0\)` ) barely any.
- Answer to Q1: the effective sample size is smaller than `\(N\)` - by how much depends on the outcome *and* the variable.
]

---

## Within and Between Effects

The choice of estimator for grouped data comes down to a choice about what sorts of things you want to know.  If you want to know something about between unit variance,  then you need a between estimator, e.g.:

`$$\bar{Y}_{\cdot j} = \delta_{0} + \delta_{1}\bar{X}_{\cdot j} + \nu_{j}$$`

 However, if you want to know something about the relationship of `\(Y\)` and `\(X\)` *within* groups (i.e., among individuals in each group), then you need a within estimator, e.g.:

`$$(Y_{ij} - \bar{Y}_{\cdot j}) = \delta_{1}(X_{ij} - \bar{X}_{\cdot j}) + (u_{ij} - \bar{u}_{\cdot j})$$`

The *total* (pooled) regression of `\(Y_{ij}\)` on `\(X_{ij}\)` is a weighted average of these two, and so answers neither question unless they happen to be the same.  Some models allow us to learn something about both types of relationships.

---

## S&amp;B Example (2)


.pull-left[
- Equation 3 stems from the individual regressions of `\(Y_{ij}\)` on `\(X_{ij}\)` within each group.  It simplifies to a single equation only when the slopes for each group are the same (as they are here)
- The between-within regression (4) writes `\(Y_{ij}\)` as a function of the group mean of `\(X\)` and the deviation from it, so it recovers both relationships at once.
- Here (4) is fit by OLS because the within-group residuals are exactly zero; a multilevel model gives the same coefficients.

1. Within Groups `\((Y_{ij}-\bar{Y}_{\cdot j} \sim X_{ij} - \bar{X}_{\cdot j})\)`

&amp; + 1.00(X_{ij}-\bar{X}_{\cdot j})

## Snijders and Bosker's Example (3)
.pull-left[
- The total regression is a blend of a between slope of -1 and a within slope of +1, so it describes neither relationship.
- The between regression is not "wrong" - it correctly describes how group means relate to each other - but it points in the opposite direction to the within-group relationship.
- Inferring the within relationship from the between relationship (or vice versa) is the ecological fallacy (or its reverse).
]

## Multilevel Regression Model: Varying Intercepts

Imagine we have the following model:

`$$Y_{ij} = \beta_{0j} + \beta_{1}x_{ij} + R_{ij}$$`

where

`$$\beta_{0j} = \gamma_{00} + U_{0j}$$`

 The new equation is:

`$$Y_{ij} = \gamma_{00} + \beta_{1}x_{ij} + U_{0j} + R_{ij}$$`

- `\(\gamma_{00}\)` is the average intercept (the expected value of `\(Y\)` when `\(x=0\)` in a typical group).
- The `\(U_{0j}\)` are deviations in the group intercepts from `\(\gamma_{00}\)`, with variance `\(\tau_{0}^{2}\)`.
- `\(R_{ij}\)` is the observation-level residual, with variance `\(\sigma^{2}\)`.
- The composite error `\(U_{0j} + R_{ij}\)` is correlated within groups with correlation `\(\rho = \tau_{0}^{2}/(\tau_{0}^{2}+\sigma^{2})\)` - the ICC.

---


## `\(U_{0j}\)` - fixed or random?

If we think of `\(U_{0j}\)` as fixed, we estimate a parameter for each of `\(U_{0j}\)` (save 1 for identification).
- These are perfectly collinear with any variable that only varies by group.
- `\(\beta_{1}\)` is estimated using only within-group variation in `\(x\)` (the within estimator).

If we think of `\(U_{0j}\)` as random, then we think of them as "group residuals", given `\(\mathbf{X}\)`.
- Appropriate if groups are "exchangeable" - no prior reason to expect a particular group to be higher or lower, once `\(\mathbf{X}\)` is accounted for.
- There is *one* parameter for the groups: the variance of the group effects, `\(\tau_{0}^{2}\)`.
- The crucial assumption: the group residuals are unrelated to the covariates, `\(E[U_{0j}|x_{ij}] = 0\)`.

---

## What Does OLS Estimate?



.pull-left[
Split the variation in `\(x\)` into within and between parts:

`$$\begin{align}SS_{W} &amp;= \sum_{ij}(x_{ij}-\bar{x}_{\cdot j})^{2}\\ SS_{B} &amp;= \sum_{j}n_{j}(\bar{x}_{\cdot j}-\bar{x})^{2}\end{align}$$`

The pooled OLS slope is a weighted average of the within and between slopes:

`$$\hat{\beta}_{OLS} = \frac{SS_{W}\hat{\beta}_{W} + SS_{B}\hat{\beta}_{B}}{SS_{W} + SS_{B}}$$`
]
.pull-right[
- `\(\hat{\beta}_{B}\)` is the regression of group means, weighted by `\(n_{j}\)`.
- The weight on the between slope is the share of `\(x\)`'s variation that is between groups - roughly `\(\rho_{x}\)`.
- Nothing about `\(Y\)` or the error dependence enters the weights.
- S&amp;B: `\(SS_{W} = 10\)`, `\(SS_{B} = 20\)`, giving `\((10 - 20)/30 = -0.33\)`, the total regression.
- Unless `\(\beta_{W} = \beta_{B}\)`, OLS answers neither question; the mix depends on how `\(x\)` varies.
]

---

## What Does Random Effects Estimate?

.pull-left[
The random effects (GLS) estimator is OLS on "quasi-demeaned" data:

`$$Y_{ij} - \theta_{j}\bar{Y}_{\cdot j} = \beta_{0}(1-\theta_{j}) + \beta_{1}(x_{ij} - \theta_{j}\bar{x}_{\cdot j})$$`

where

`$$\theta_{j} = 1 - \sqrt{\frac{\sigma^{2}}{\sigma^{2} + n_{j}\tau_{0}^{2}}}$$`
]
.pull-right[
- When `\(\theta_{j}=0\)` (no group variance), RE is pooled OLS.
- When `\(\theta_{j}\rightarrow 1\)` (large groups or large `\(\tau_{0}^{2}\)`), RE approaches fixed effects.
- In between, `\(\hat{\beta}_{1}\)` is a weighted average of the within and between slopes.
- If `\(U_{0j}\)` is correlated with `\(\bar{x}_{\cdot j}\)`, then the between slope is biased and that bias leaks into `\(\hat{\beta}_{1}\)`.
- This is the reason the Hausman test exists - it asks whether the RE and FE estimates of `\(\beta_{1}\)` differ.
]

---

## OLS, RE and FE: One Family



All three are the same weighted average, with the between information discounted by `\(\lambda\)`:

`$$\hat{\beta} \approx \frac{SS_{W}\hat{\beta}_{W} + \lambda SS_{B}\hat{\beta}_{B}}{SS_{W} + \lambda SS_{B}}$$`

.tiny[
| Estimator | `\(\lambda\)` | Weight on between slope (BES) | Assumes | BES income slope |
|-----------|------------|-------------------------------|---------|------------------|
| OLS | 1 | 0.19 | Independent errors | 0.176 |
| RE | `\(\frac{\sigma^{2}}{\sigma^{2} + n_{j}\tau_{0}^{2}}\)` ( `\(\approx\)` 0.50) | 0.11 | `\(U_{0j}\)` unrelated to `\(x\)` | 0.152 |
| FE | 0 | 0 | Nothing about `\(U_{0j}\)` | 0.122 |

- RE discounts the between information because group means are noisy when `\(\tau_{0}^{2}\)` is large relative to `\(\sigma^{2}/n_{j}\)`; FE discards it.
- If `\(\beta_{W} = \beta_{B}\)`, all three agree and RE is most efficient; if not, OLS and RE are blends set by the data, not the question.
- Only FE (and REWB's within effect, next) is protected against `\(U_{0j}\)` correlated with `\(x\)`. Naive OLS SEs are also wrong (Moulton).
]

---

## Bell and Jones: Model Both (REWB)

Bell and Jones (2015) suggest the "within-between" random effects model (Mundlak 1978):

`$$Y_{ij} = \beta_{0} + \beta_{W}(x_{ij} - \bar{x}_{\cdot j}) + \beta_{B}\bar{x}_{\cdot j} + \gamma z_{j} + U_{0j} + R_{ij}$$`

- `\(\beta_{W}\)` is the within effect. Its point estimate is *identical* to the fixed effects estimate, so correlation between `\(U_{0j}\)` and `\(\bar{x}_{\cdot j}\)` cannot bias it.
- `\(\beta_{B}\)` is the between effect - the relationship between group means.
- `\(\beta_{B} - \beta_{W}\)` is the *contextual* effect: the difference in `\(Y\)` between two people with the same `\(x\)` in groups whose means differ by one unit. (Mundlak's version, `\(Y_{ij} = \beta x_{ij} + \pi\bar{x}_{\cdot j}\)`, estimates `\(\pi = \beta_{B} - \beta_{W}\)` directly.)
- Testing `\(\beta_{B} = \beta_{W}\)` is (asymptotically) the Hausman test. Once both are in the model, the "fixed or random?" question no longer determines the within effect.
- Unlike FE, we can still include group-level variables `\(z_{j}\)` and estimate `\(\tau_{0}^{2}\)`.

---

## Hazlett and Wainstein (2022)

.pull-left[
Hazlett and Wainstein (*Political Analysis*) ask what multilevel models buy us if the goal is the within relationship:

- Plain RE is biased if `\(U_{0j}\)` is related to `\(\bar{x}_{\cdot j}\)`.
- Adding the group mean (Mundlak/REWB) gives the same within estimate as FE.
- Model-based SEs can still be wrong if the random effects are misspecified (e.g., unmodelled slope variation) - use cluster-robust (CR2) SEs.
]
.pull-right[
- Coefficients on group-level variables ( `\(\gamma\)`, and `\(\beta_{B}\)` ) are *not* protected. Nothing in the model rules out group-level confounders, because there is no "within" variation to fall back on.
- These coefficients are descriptive associations between groups - don't interpret them causally without a separate design-based argument.
]

---


## Fixed or Random?

Older advice (e.g., "use FE if the groups are of interest") has largely given way to the following:

1. If you only care about within-group effects, FE and REWB give the same answer; FE is simpler, REWB lets you also look at group-level variables, `\(\tau_{0}^{2}\)` and predictions for new groups.
2. Never use plain RE (one coefficient per variable) without checking that within and between effects are the same - or just separate them.
3. If you care about group-level variables, you need random effects (FE absorbs them), but heed Hazlett and Wainstein's warning about interpreting them.
4. If groups are small, random effects borrow strength across groups through shrinkage (more on this below).
5. Normality of `\(U_{0j}\)` matters relatively little for the fixed coefficients; correlation of `\(U_{0j}\)` with `\(X\)` matters a lot (Clark and Linzer 2015; Bell, Fairbrother and Jones 2019).

---

## Mixed Models Example: British Context Data

The data are a subset from the 1997 British Election Study using a multistage sample where first parliamentary constituencies were randomly selected and then voters were randomly selected from within the selected constituencies (N=2141, 136 Constituencies)
- LRSCALE: left-right values scale (higher = more right-wing)
- PROFMAN: `\(\%\)` professionals in constituency
- AGE
- SEX
- DEGREE (respondent obtained a univ degree)
- INCOME (household income)
- PANO: identifies the constituency

---

## Hypotheses

1. The richer one is, the more right-wing on average their attitudes will be (a positive *within* effect of income).
2. Context matters: people who live in richer constituencies will hold more right-wing attitudes than people with the same income who live in poorer constituencies (a positive *contextual* effect, `\(\beta_{B} - \beta_{W} &gt; 0\)`).
3. The effect of income differs across constituencies (a *random slope* for income, `\(\tau_{1}^{2} &gt; 0\)`).

Note that H2 and H3 are different claims - H2 is about the intercept depending on the constituency's average income, H3 is about the slope varying across constituencies.

---

## Step 1: The Empty Model


``` r
library(rio)
library(lme4)
dat &lt;- import("data/context.dta")
dat &lt;- dat %&gt;% mutate(SEX = rio::factorize(SEX))
m0 &lt;- lmer(LRSCALE ~ 1 + (1|PANO), data=dat)
VarCorr(m0)
```

```
##  Groups   Name        Std.Dev.
##  PANO     (Intercept) 1.0935  
##  Residual             3.5996
```

``` r
vc &lt;- as.data.frame(VarCorr(m0))
icc &lt;- vc$vcov[1]/sum(vc$vcov)
nbar &lt;- mean(table(dat$PANO))
c(icc = icc, nbar = nbar, deff = 1 + (nbar-1)*icc)
```

```
##         icc        nbar        deff 
##  0.08449438 15.74264706  2.24567086
```



About 8% of the variance in left-right attitudes is between constituencies. That seems small, but with 15.7 respondents per constituency, the effective sample size for constituency-level quantities is only about 953, not 2141.

## Between and Within Variables with `bwreg`

.pull-left[
The `bwreg` package provides `bet()` and `win()` that you can use directly in a model formula:

- `bet(x, g)` - the mean of `x` in group `g`
- `win(x, g)` - the deviation of `x` from its group mean
- For factors, `bet()` gives the proportion of the group in each non-reference category and `win()` gives the dummy variable minus that proportion.


``` r
remotes::install_github("davidaarmstrong/bwreg")
```
]
.pull-right[
Why not just make the variables before fitting the model?

- Like `poly()`, the group means from the fitting data are stored with the model.
- `predict()` and `marginaleffects` then know that `bet(x, g)` and `win(x, g)` both come from `x`.
- Changing `x` for an observation in a real group only moves its within component - so slopes are within effects.
- `between_grid()` builds hypothetical groups where changing `x` moves the group mean - so slopes are between effects.
]

---

## Step 2: Modeling both Between and Within Effects


``` r
library(bwreg)
mod &lt;- lmer(LRSCALE ~ bet(INCOME, PANO) + win(INCOME, PANO) +
              bet(AGE, PANO) + win(AGE, PANO) +
              bet(SEX, PANO) + win(SEX, PANO) +
              PROFMAN + (1|PANO), data=dat)
round(coef(summary(mod)), 3)
```

```
##                   Estimate Std. Error t value
## (Intercept)          9.410      1.021   9.219
## bet(INCOME, PANO)    0.341      0.058   5.848
## win(INCOME, PANO)    0.157      0.020   7.831
## bet(AGE, PANO)       0.041      0.019   2.179
## win(AGE, PANO)       0.026      0.005   5.236
## bet(SEX, PANO)       1.246      0.679   1.836
## win(SEX, PANO)       0.148      0.161   0.921
## PROFMAN              0.032      0.015   2.117
```

`PROFMAN` only varies across constituencies, so it goes in as is.

---

## Within Effects = Fixed Effects


``` r
fe_mod &lt;- lm(LRSCALE ~ INCOME + AGE + SEX + factor(PANO), data=dat)
re_mod &lt;- lmer(LRSCALE ~ INCOME + AGE + SEX + PROFMAN + (1|PANO), data=dat)
round(cbind(
  FE   = coef(fe_mod)[c("INCOME", "AGE", "SEXmen")],
  REWB = fixef(mod)[c("win(INCOME, PANO)", "win(AGE, PANO)", "win(SEX, PANO)")],
  RE   = fixef(re_mod)[c("INCOME", "AGE", "SEXmen")]), 4)
```

```
##            FE   REWB     RE
## INCOME 0.1567 0.1567 0.1745
## AGE    0.0264 0.0264 0.0282
## SEXmen 0.1478 0.1478 0.1863
```

The within coefficients from the REWB model are identical to FE.  Plain RE sits between the within and between slopes, as the quasi-demeaning formula suggests.

---

## Interpretation



- **Within (H1)**: comparing two people in the same constituency, a one-unit increase in income is associated with a 0.157 unit increase in right-wing attitudes.

- **Between**: comparing constituencies, a one-unit increase in average income is associated with a 0.341 unit increase in average right-wing attitudes. This is the *total* between-constituency association - it includes the fact that richer constituencies contain richer people.

- **Contextual (H2)**: the difference, 0.341 - 0.157 = 0.184, is the expected difference in attitudes between two people *with the same income* living in constituencies whose average income differs by one unit.

- Per Hazlett and Wainstein, the between and contextual effects are associations among constituencies; they could reflect anything else that differs between rich and poor constituencies.

---

## Testing the Contextual Effect (H2)


``` r
library(marginaleffects)
hypotheses(mod, "`bet(INCOME, PANO)` - `win(INCOME, PANO)` = 0")
```

```
## 
##                               Hypothesis Estimate Std. Error    z Pr(&gt;|z|)   S
##  `bet(INCOME,PANO)`-`win(INCOME,PANO)`=0    0.184     0.0617 2.99  0.00279 8.5
##   2.5 % 97.5 %
##  0.0635  0.305
```

Equivalently, `car::linearHypothesis()` works on the same coefficients.  This is the regression-based version of the Hausman test: here, plain RE would not be appropriate for income.

## Within and Between Slopes with `marginaleffects`

.pull-left[

``` r
w_eff &lt;- avg_slopes(mod, variables = "INCOME",
                    re.form = NA)
bg &lt;- between_grid(mod, INCOME = c(4, 6, 8))
b_eff &lt;- avg_slopes(mod, variables = "INCOME",
                    newdata = bg, re.form = NA)
bind_rows(Within = as.data.frame(w_eff),
          Between = as.data.frame(b_eff),
          .id = "Effect") %&gt;%
  select(Effect, estimate, std.error, conf.low, conf.high) %&gt;%
  mutate(across(where(is.numeric), ~round(.x, 3)))
```

```
##    Effect estimate std.error conf.low conf.high
## 1  Within    0.157     0.020    0.117     0.196
## 2 Between    0.341     0.058    0.227     0.455
```

- Slopes on the real data are within effects.
- Slopes on `between_grid()` data are between effects - each row is its own hypothetical constituency.

## Step 3: A Random Slope for Income (H3)


``` r

## Reading the Random Slope Result



- The fit is *singular*: a correlation of -1 and a tiny slope SD. The data can't support a slope variance - no evidence for H3.
- Variance components are tested on the boundary of the parameter space ( `\(\tau_{1}^{2} \geq 0\)` ), so the usual `\(\chi^{2}\)` reference distribution is too conservative.
  - For one variance: halve the p-value (a 50:50 mixture of `\(\chi^{2}_{0}\)` and `\(\chi^{2}_{1}\)`).
  - For a slope variance plus its covariance: a 50:50 mixture of `\(\chi^{2}_{1}\)` and `\(\chi^{2}_{2}\)`. About half the time the slope variance would be negative, is held at 0, and only the covariance counts ( `\(\chi^{2}_{1}\)` ); otherwise both are free ( `\(\chi^{2}_{2}\)` ).
- Here, with LR statistic 0.600, the naive `\(\chi^{2}_{2}\)` p-value is 0.741, and the mixture p-value is

`$$p = 0.5\,P(\chi^{2}_{1} &gt; 0.600) + 0.5\,P(\chi^{2}_{2} &gt; 0.600) = 0.5(0.439) + 0.5(0.741) = 0.590$$`
- When a fit is singular, simplify the random effects rather than reporting it as is (see "When Things Go Wrong" below).

## Obtaining Estimates of `\(U_{0j}\)`

For the empty model, the estimate of each group's intercept is a weighted average of the group's own mean and the overall mean (Snijders and Bosker):

`$$\begin{align}
\hat{\beta}_{0j}^{EB} &amp;= \lambda_{j}\bar{Y}_{\cdot j} + (1-\lambda_{j})\hat{\gamma}_{00}, \qquad \hat{U}_{0j} = \lambda_{j}(\bar{Y}_{\cdot j} - \hat{\gamma}_{00})\\
\lambda_{j} &amp;= \frac{\tau_{0}^{2}}{\tau_{0}^{2} + \frac{\sigma^{2}}{n_{j}}}, \qquad \hat{\gamma}_{00} = \frac{\sum_{j} w_{j}\bar{Y}_{\cdot j}}{\sum_{j} w_{j}}, \quad w_{j} = \frac{1}{\tau_{0}^{2} + \sigma^{2}/n_{j}}
\end{align}$$`

- `\(\lambda_{j}\)` is the reliability of the group mean.
- The group estimates are pulled (shrunk) toward `\(\hat{\gamma}_{00}\)`, more so when `\(n_{j}\)` is small or `\(\tau_{0}^{2}\)` is small relative to `\(\sigma^{2}\)`.
- With covariates, the same logic applies to the group residuals; R does the computation for us.

## REML vs ML

- `lmer()` uses *restricted* maximum likelihood (REML) by default.  REML accounts for the degrees of freedom used to estimate the fixed effects, so its variance estimates are less biased - this matters most when the number of groups is small.
- REML likelihoods are only comparable across models with the *same fixed effects*.
  - Comparing random-effect structures: REML is fine (`anova(..., refit=FALSE)`).
  - Comparing fixed effects with a likelihood ratio test: refit with ML (`anova()` does this by default for `merMod` objects).
- Report REML estimates for the final model.

---

## p-values

Note that `lme4` model summaries don't come with p-values because the `\(t\)` statistics don't have an exact `\(t\)` distribution with known degrees of freedom - for group-level variables, the relevant "sample size" is closer to the number of groups than the number of observations. Approximations:

- Satterthwaite or Kenward-Roger degrees of freedom (`lmerTest`, `pbkrtest`). Kenward-Roger also adjusts the standard errors and does best with few groups.
- Parametric bootstrap (`pbkrtest::PBmodcomp()`) or profile likelihood intervals (`confint(mod, method="profile")`).
- Avoid using the residual df ( `\(N-p\)` ) - this treats group-level variables as if we had `\(N\)` independent observations.

## Cluster-Robust Standard Errors

Cluster-robust standard errors are a post-hoc fix to the standard errors that allows *any* pattern of correlation (and heteroskedasticity) among observations in the same cluster.
- They are often used with OLS as an alternative to a multilevel model.
  - OLS doesn't separate within and between effects, but you can use `bet()` and `win()` in `lm()` too.
  - They fix the standard errors but don't model the dependence, so they give up the efficiency of GLS, any estimate of `\(\tau_{0}^{2}\)` and shrunken group estimates.
- They can also be used *with* a multilevel model, to protect against a misspecified random-effect structure (Hazlett and Wainstein's recommendation).
- The standard (CR1) version is biased downward with few clusters. Use the bias-reduced CR2 version with Satterthwaite degrees of freedom (Pustejovsky and Tipton 2018, `clubSandwich`) or a wild cluster bootstrap.

---

## RSE Example


``` r
library(clubSandwich)
ols &lt;- lm(LRSCALE ~ bet(INCOME, PANO) + win(INCOME, PANO) + bet(AGE, PANO) + win(AGE, PANO) +
              bet(SEX, PANO) + win(SEX, PANO) + PROFMAN, data=dat)
ses &lt;- cbind(
  OLS       = sqrt(diag(vcov(ols))),
  OLS_CR2   = sqrt(diag(vcovCR(ols, cluster=dat$PANO, type="CR2"))),
  MLM       = sqrt(diag(vcov(mod))),
  MLM_CR2   = sqrt(diag(vcovCR(mod, type="CR2"))))
round(ses[-1, ], 4)
```

## Varying Slopes and Cross-Level Interactions

If we think the effect of `\(x\)` varies across groups, we can let the slope vary and try to explain that variation with a group-level variable `\(z_{j}\)`:

`$$\begin{align}
Y_{ij} &amp;= \beta_{0j} + \beta_{1j}x_{ij} + R_{ij}\\
\beta_{0j} &amp;= \gamma_{00} + \gamma_{01}z_{j} + U_{0j}\\
\beta_{1j} &amp;= \gamma_{10} + \gamma_{11}z_{j} + U_{1j}
\end{align}$$`

Substituting gives

`$$Y_{ij} = \gamma_{00} + \gamma_{01}z_{j} + \gamma_{10}x_{ij} + \gamma_{11}x_{ij}z_{j} + U_{0j} + U_{1j}x_{ij} + R_{ij}$$`

- `\(\gamma_{11}\)` is the *cross-level interaction*.
- `\(U_{1j}\)` is the part of the slope variation that `\(z_{j}\)` doesn't explain, with variance `\(\tau_{1}^{2}\)`.
- Use the within version of `\(x\)` (`win(x, g)`) so the interaction is about the within effect and isn't contaminated by the between effect.

---

## Always Include the Random Slope

Heisig and Schaeffer (2019): if you estimate a cross-level interaction `\(x_{ij}z_{j}\)` *without* a random slope for `\(x_{ij}\)`, the residual slope variation is ignored and the standard errors for `\(x_{ij}\)` and `\(x_{ij}z_{j}\)` are much too small.

- Each group contributes only one piece of information about how the slope depends on `\(z_{j}\)`, so the effective sample size for `\(\gamma_{11}\)` is the number of groups, not the number of observations.
- Leaving out `\(U_{1j}\)` pretends we have many more independent pieces of information than we do.

Example: WVS (2005-2009), 48 countries.  Does religiosity move people to the right more in more religious countries?

- `\(x_{ij}\)`: importance of religion to the respondent (within-country deviation)
- `\(z_{j}\)`: average importance of religion in the country (between)

---

## Heisig and Schaeffer Example


``` r
wvs &lt;- import("data/wvs2005_2009_mlm.dta") %&gt;%
  mutate(country = rio::factorize(country), sex = rio::factorize(sex),
         relig = 5 - religimp, relig = relig - mean(relig, na.rm=TRUE)) %&gt;%
  select(lrself, relig, age, sex, educ, income, country) %&gt;%
  na.omit() %&gt;% droplevels()
hs1 &lt;- lmer(lrself ~ bet(relig, country)*win(relig, country) + age + sex + educ + income +
              (1|country), data=wvs)
hs2 &lt;- lmer(lrself ~ bet(relig, country)*win(relig, country) + age + sex + educ + income +
              (1 + win(relig, country)|country), data=wvs)
cf &lt;- c("win(relig, country)", "bet(relig, country):win(relig, country)")
round(cbind(b_noRS = fixef(hs1)[cf], se_noRS = sqrt(diag(vcov(hs1)))[cf],
            b_RS = fixef(hs2)[cf], se_RS = sqrt(diag(vcov(hs2)))[cf]), 3)
```

## How Many Groups Do We Need?

Cross-national work often has 20-50 countries.  What does that do to us?

- Stegmueller (2013): with few countries, ML estimates of country-level effects have confidence intervals that are too narrow, and cross-level interactions are worse.
- Elff, Heisig, Schaeffer and Shikano (2021): much of the problem goes away with REML and Kenward-Roger (or Satterthwaite) degrees of freedom - even with relatively few clusters.
- Cluster-robust SEs have the same issue - use CR2 with Satterthwaite df, or a wild cluster bootstrap.
- Bayesian estimation (e.g., `brms`) with weakly informative priors on `\(\tau\)` stabilizes the variance components when groups are very few.
- Regardless, a country-level coefficient is estimated from (at most) as many pieces of information as there are countries - don't load up on country-level covariates.

---

## Centring

.pull-left[
**Grand-mean centring** ( `\(x_{ij} - \bar{x}_{\cdot\cdot}\)` )
- Just moves the intercept.
- The coefficient on `\(x\)` is still a blend of the within and between effects.
- Useful for making intercepts and lower-order terms of interactions interpretable (as with `relig` above).
]
.pull-right[
**Group-mean centring** ( `\(x_{ij} - \bar{x}_{\cdot j}\)`, i.e., `win()` )
- Changes the model - the coefficient is the pure within effect.
- Must be accompanied by `\(\bar{x}_{\cdot j}\)` (`bet()`), otherwise the between variation is thrown away.
- Should be used for the random slope and for cross-level interactions (Enders and Tofighi 2007).
]

---

## Multilevel GLMs

Everything so far extends to non-linear models with a random intercept on the linear predictor:

`$$\Pr(Y_{ij}=1) = F(\gamma_{00} + \beta_{W}(x_{ij}-\bar{x}_{\cdot j}) + \beta_{B}\bar{x}_{\cdot j} + U_{0j})$$`


``` r
glmer(y ~ bet(x, g) + win(x, g) + (1|g), data=dat, family=binomial)
ordinal::clmm(y ~ bet(x, g) + win(x, g) + (1|g), data=dat)
glmmTMB::glmmTMB(y ~ bet(x, g) + win(x, g) + (1|g), data=dat, family=nbinom2)
```

One important difference: the coefficients are now *conditional* (subject-specific), not *marginal* (population-averaged).

---

## Conditional vs Population-Averaged Effects

The coefficients describe the effect of `\(x\)` for a group with a given `\(U_{0j}\)` (e.g., a typical group with `\(U_{0j} = 0\)`).  The population-averaged probability integrates over the groups:

`$$\Pr(Y=1|x) = \int F(x\beta + u)\phi(u; 0, \tau_{0}^{2})du \neq F(x\beta)$$`

.pull-left[
- Because `\(F\)` is non-linear, averaging over groups flattens the curve.
- For the logit, `\(\beta_{PA} \approx \beta_{C}/\sqrt{1 + 0.346\tau_{0}^{2}}\)` (Zeger, Liang and Albert 1988).
]
.pull-right[
- GEE or a GLM with cluster-robust SEs estimates `\(\beta_{PA}\)`; `glmer()` estimates `\(\beta_{C}\)`.  Neither is wrong - they answer different questions.
- The bigger `\(\tau_{0}^{2}\)`, the bigger the difference.
]

## When Things Go Wrong: Estimation

.tiny[
.pull-left[
**Singular or near-singular fit**
- *Symptom*: a variance at (or near) 0, or a correlation of `\(\pm 1\)` (`isSingular()`, `summary(rePCA(mod))`).
- *Cause*: random effects too complex for the data (few or small groups, little variation).
- *Fix*: simplify - drop the correlation, `(1|g) + (0 + win(x, g)|g)`, or drop the term. A slope needed for a cross-level interaction can stay with a weak prior on `\(\tau\)` (`blme::blmer()`, `brms`).

**Separation in a GLMM**
- *Symptom*: huge coefficients and SEs, because an outcome never (or always) occurs for some values of `\(x\)`.
- *Fix*: priors on the coefficients (`blme::bglmer()`, `brms`).
]
.pull-right[
**Convergence warnings**
- *Symptom*: "failed to converge", "max&amp;#124;grad&amp;#124;" warnings.
- *Cause*: badly scaled predictors, over-complex random effects, or false alarms in large samples.
- *Fix*: rescale (e.g., age in decades); switch optimizers (`optimizer="bobyqa"`); if `allFit(mod)` agrees across optimizers, the warning is harmless.

**Inaccurate GLMM estimates**
- *Cause*: the Laplace approximation is poor with small binary clusters.
- *Fix*: `glmer(..., nAGQ = 10)` (random intercept only) or `brms`.
]
]

---

## When Things Go Wrong: Assumptions

.tiny[
.pull-left[
**Residual variance differs across groups or with `\(x\)`**
- *Symptom*: residual spread differs by group or fitted value (plot residuals by group).
- *Fix*: model it, `glmmTMB(..., dispformula = ~ x)` or `nlme::lme(..., weights = varIdent(form = ~ 1|type))`, or use CR2 SEs.

**Group-level variance differs by type of group**
- *Symptom*: e.g., countries in one region vary far more than in another.
- *Fix*: a separate variance for each type (with `type` as a fixed effect too): `(0 + dummy(type, "a")|g) + (0 + dummy(type, "b")|g)`.
]
.pull-right[
**Non-normal random effects or outlying groups**
- *Symptom*: heavy tails in `qqnorm(ranef(mod)$g[,1])`; one group drives the results.
- *Fix*: refit dropping each group in turn (or `influence.ME`) and report the sensitivity; robust fits (`robustlmm::rlmer()`); CR2 SEs. Fixed effects are fairly robust to non-normality.

**Misspecified random effects in general**
- *Symptom*: model-based and CR2 SEs disagree.
- *Fix*: rely on CR2 for inference and revisit the random-effect structure.

`performance::check_model(mod)` produces most of these diagnostic plots in one place.
]
]
